<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">

<style>
  :root {
    --bg-gradient-1: #f6ecd2;
    --bg-gradient-2: #ecdcb0;
    --bg-deep: #e2cd9c;
    --bg-card: #f1e2bc;
    --bg-card-alt: #e8d7ab;
    --bg-nav: #e6d4a2;
    --border-strong: #8a6a3a;
    --border-tint: 122,90,42;
    --text-main: #3a2a15;
    --text-gold: #8a5a16;
    --text-label: #7a6440;
    --text-muted: #8f7850;
    --text-dim: #a89470;
    --text-desc: #5c4a2c;
    --text-note: #7a6440;
    --text-chip: #6b5430;
    --accent-red-text: #b91c1c;
    --accent-green-text: #157a3d;
    --accent-blue-text: #0a6ea8;
    --accent-purple-text: #6d28d9;
    --accent-purple-solid: #7c3aed;
    --accent-gray-text: #55503f;
    --accent-gold-badge-text: #7c4a12;
    --bg-texture: rgba(90,60,20,0.035);
    --checkbox-border-idle: rgba(58,42,21,0.3);
    --ink-bright: #efe4cf;
  }
  :root[data-theme="deneor"] {
    --bg-gradient-1: #1a3327;
    --bg-gradient-2: #0d1b15;
    --bg-deep: #0a1712;
    --bg-card: #173224;
    --bg-card-alt: #12281c;
    --bg-nav: #0f2018;
    --border-strong: #154734;
    --border-tint: 90,170,130;
    --text-main: #e7f1ea;
    --text-gold: #e6c988;
    --text-label: #a9c9b4;
    --text-muted: #8caf9b;
    --text-dim: #4f6f5c;
    --text-desc: #cfe2d5;
    --text-note: #83a692;
    --text-chip: #bcd6c4;
    --accent-red-text: #fca5a5;
    --accent-green-text: #86efac;
    --accent-blue-text: #7dd3fc;
    --accent-purple-text: #c4b5fd;
    --accent-purple-solid: #a78bfa;
    --accent-gray-text: #cbd5e1;
    --accent-gold-badge-text: #e0c890;
    --bg-texture: rgba(255,255,255,0.012);
    --checkbox-border-idle: rgba(255,255,255,0.25);
  }
  html, body {
    height: 100%;
    margin: 0;
    background: var(--bg-deep);
    -webkit-tap-highlight-color: transparent;
    overscroll-behavior: none;
  }
  body {
    font-family: -apple-system, 'SF Pro', system-ui, sans-serif;
    color: var(--text-main);
  }
  #app {
    max-width: 480px;
    margin: 0 auto;
    height: 100vh;
    height: 100dvh;
    position: relative;
    overflow: hidden;
    background:
      linear-gradient(160deg, var(--bg-gradient-1) 0%, var(--bg-gradient-2) 100%),
      repeating-linear-gradient(45deg, var(--bg-texture) 0px, var(--bg-texture) 2px, transparent 2px, transparent 7px);
    box-sizing: border-box;
    padding: max(20px, env(safe-area-inset-top) + 14px) max(18px, env(safe-area-inset-right) + 4px) max(16px, env(safe-area-inset-bottom) + 12px) max(18px, env(safe-area-inset-left) + 4px);
    display: flex;
    flex-direction: column;
  }
  .font-cinzel { font-family: 'Cinzel', serif; }
  input::placeholder { color: var(--text-dim); }
  .hscroll { scrollbar-width: none; -ms-overflow-style: none; touch-action: pan-x pan-y; }
  .hscroll::-webkit-scrollbar { display: none; }
  [data-scroll-root] { -webkit-overflow-scrolling: touch; }
  /* Sur tactile, un doigt qui glisse en diagonale sur une rangée .hscroll peut encore être
     capté par son propre scroll horizontal au lieu de faire défiler la page verticalement,
     même avec touch-action:pan-x pan-y (arbitrage du geste peu fiable selon les navigateurs).
     On supprime l'ambiguïté en repassant ces rangées en habillage (wrap) sur pointeur grossier
     (doigt) : plus de second axe de scroll imbriqué, tout redevient un simple scroll vertical. */
  @media (pointer: coarse) {
    .hscroll { flex-wrap: wrap; overflow-x: visible; }
  }
  .toggle-track { width: 40px; height: 24px; border-radius: 12px; position: relative; cursor: pointer; flex: none; transition: background 150ms; }
  .toggle-knob { width: 18px; height: 18px; border-radius: 9px; background: var(--ink-bright); position: absolute; top: 3px; transition: left 150ms; }
  input:disabled { opacity: 0.45; }
  @keyframes concentration-pulse {
    0%, 100% { box-shadow: inset 0 0 0 0 rgba(167,139,250,0); }
    50% { box-shadow: inset 0 0 10px 3px rgba(167,139,250,0.7); }
  }
  .concentration-active { animation: concentration-pulse 1.7s ease-in-out infinite; }
  @property --hp-ring-angle {
    syntax: '<angle>';
    inherits: false;
    initial-value: 0deg;
  }
  @keyframes hp-concentration-spin { to { --hp-ring-angle: 360deg; } }
  .hp-concentration-ring { position: relative; }
  .hp-concentration-ring::before {
    content: '';
    position: absolute;
    inset: -3px;
    border-radius: 19px;
    padding: 3px;
    --hp-ring-angle: 0deg;
    background: conic-gradient(from var(--hp-ring-angle),
      rgba(167,139,250,0) 0deg,
      rgba(167,139,250,0) 240deg,
      rgba(167,139,250,0.75) 320deg,
      rgba(216,205,254,1) 355deg,
      rgba(167,139,250,0) 360deg);
    -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
    -webkit-mask-composite: xor;
            mask-composite: exclude;
    animation: hp-concentration-spin 2.4s linear infinite;
    pointer-events: none;
  }
  @keyframes concentration-toast-in {
    from { transform: translateX(-50%) translateY(-140%); opacity: 0; }
    to { transform: translateX(-50%) translateY(0); opacity: 1; }
  }
  @keyframes concentration-toast-out {
    from { transform: translateX(-50%) translateY(0); opacity: 1; }
    to { transform: translateX(-50%) translateY(-140%); opacity: 0; }
  }
  .concentration-toast {
    position: fixed;
    left: 50%;
    top: max(18px, env(safe-area-inset-top) + 14px);
    transform: translateX(-50%);
    z-index: 80;
    display: flex;
    align-items: center;
    gap: 10px;
    width: min(92vw, 400px);
    padding: 14px 14px 14px 16px;
    border-radius: 12px;
    background: #6d28d9;
    color: #f5f3ff;
    box-shadow: 0 10px 28px rgba(0,0,0,0.4);
  }
  .concentration-toast-enter { animation: concentration-toast-in 320ms ease-out; }
  .concentration-toast-leave { animation: concentration-toast-out 320ms ease-in forwards; }
  @keyframes fb-toast-in {
    from { transform: translateY(140%); opacity: 0; }
    to { transform: translateY(0); opacity: 1; }
  }
  @keyframes fb-toast-out {
    from { transform: translateY(0); opacity: 1; }
    to { transform: translateY(140%); opacity: 0; }
  }
  .fb-toast {
    position: fixed;
    left: 12px;
    right: 12px;
    bottom: max(18px, env(safe-area-inset-bottom) + 14px);
    z-index: 80;
    padding: 12px 16px;
    border-radius: 10px;
    background: #157a3d;
    color: #f0fff4;
    font-size: 13px;
    font-weight: 600;
    text-align: center;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    box-shadow: 0 10px 28px rgba(0,0,0,0.35);
  }
  .fb-toast-enter { animation: fb-toast-in 260ms ease-out; }
  .fb-toast-leave { animation: fb-toast-out 260ms ease-in forwards; }
  .rest-toast {
    position: fixed;
    left: 12px;
    right: 12px;
    bottom: max(18px, env(safe-area-inset-bottom) + 14px);
    z-index: 80;
    padding: 12px 16px;
    border-radius: 10px;
    background: #157a3d;
    color: #f0fff4;
    font-size: 13px;
    font-weight: 600;
    text-align: center;
    box-shadow: 0 10px 28px rgba(0,0,0,0.35);
  }
  .rest-toast-enter { animation: fb-toast-in 260ms ease-out; }
  .rest-toast-leave { animation: fb-toast-out 260ms ease-in forwards; }
  @keyframes codex-preview-backdrop-in { from { opacity: 0; } to { opacity: 1; } }
  @keyframes codex-preview-backdrop-out { from { opacity: 1; } to { opacity: 0; } }
  @keyframes codex-preview-card-in {
    from { transform: scale(0.82); opacity: 0; }
    to { transform: scale(1); opacity: 1; }
  }
  @keyframes codex-preview-card-out {
    from { transform: scale(1); opacity: 1; }
    to { transform: scale(0.82); opacity: 0; }
  }
  .codex-preview-backdrop {
    position: fixed;
    inset: 0;
    z-index: 90;
    background: rgba(0,0,0,0.78);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
    box-sizing: border-box;
  }
  .codex-preview-backdrop-enter { animation: codex-preview-backdrop-in 200ms ease-out; }
  .codex-preview-backdrop-leave { animation: codex-preview-backdrop-out 200ms ease-in forwards; }
  .codex-preview-card { display: flex; flex-direction: column; align-items: center; gap: 16px; max-width: min(92vw, 380px); }
  .codex-preview-card-enter { animation: codex-preview-card-in 220ms cubic-bezier(0.2, 0.8, 0.3, 1.15); }
  .codex-preview-card-leave { animation: codex-preview-card-out 200ms ease-in forwards; }
  @keyframes spell-detail-backdrop-in { from { opacity: 0; } to { opacity: 1; } }
  @keyframes spell-detail-backdrop-out { from { opacity: 1; } to { opacity: 0; } }
  @keyframes spell-detail-card-in {
    from { transform: scale(0.9) translateY(12px); opacity: 0; }
    to { transform: scale(1) translateY(0); opacity: 1; }
  }
  @keyframes spell-detail-card-out {
    from { transform: scale(1) translateY(0); opacity: 1; }
    to { transform: scale(0.9) translateY(12px); opacity: 0; }
  }
  .spell-detail-backdrop {
    position: fixed;
    inset: 0;
    z-index: 90;
    background: rgba(0,0,0,0.6);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
    box-sizing: border-box;
  }
  .spell-detail-backdrop-enter { animation: spell-detail-backdrop-in 200ms ease-out; }
  .spell-detail-backdrop-leave { animation: spell-detail-backdrop-out 200ms ease-in forwards; }
  .spell-detail-card {
    width: 100%;
    max-width: 360px;
    max-height: 80vh;
    overflow-y: auto;
    background: var(--bg-card);
    border: 1px solid rgba(var(--border-tint), 0.3);
    border-radius: 16px;
    padding: 20px;
    display: flex;
    flex-direction: column;
    gap: 12px;
    box-shadow: 0 16px 40px rgba(0,0,0,0.45);
  }
  .spell-detail-card-enter { animation: spell-detail-card-in 220ms cubic-bezier(0.2, 0.8, 0.3, 1.15); }
  .spell-detail-card-leave { animation: spell-detail-card-out 200ms ease-in forwards; }
  @keyframes character-slide-next {
    from { opacity: 0; transform: translateX(60px); }
    to { opacity: 1; transform: translateX(0); }
  }
  @keyframes character-slide-prev {
    from { opacity: 0; transform: translateX(-60px); }
    to { opacity: 1; transform: translateX(0); }
  }
  .character-anim-next { animation: character-slide-next 650ms ease-in-out; }
  .character-anim-prev { animation: character-slide-prev 650ms ease-in-out; }
</style>
</head>
<body>
<div id="app"></div>
<script>
(function () {
  'use strict';

  var STORAGE_KEY = 'jdr_character_tracker_state';

  function cloneDeep(x) {
    return JSON.parse(JSON.stringify(x));
  }

  function makeSpellLevels() {
    var levels = [];
    for (var i = 1; i <= 9; i++) {
      levels.push({ level: i, enabled: false, max: 0, used: [] });
    }
    return levels;
  }

  var ABILITY_KEYS = ['force', 'dexterite', 'constitution', 'intelligence', 'sagesse', 'charisme'];
  var ABILITY_LABELS = { force: 'Force', dexterite: 'Dextérité', constitution: 'Constitution', intelligence: 'Intelligence', sagesse: 'Sagesse', charisme: 'Charisme' };
  var SKILL_NAMES = ['Acrobaties', 'Arcanes', 'Athlétisme', 'Discrétion', 'Dressage', 'Escamotage', 'Histoire', 'Intimidation', 'Intuition', 'Investigation', 'Médecine', 'Nature', 'Perception', 'Persuasion', 'Religion', 'Représentation', 'Survie', 'Tromperie'];

  function makeAbilityScores() {
    var scores = {};
    ABILITY_KEYS.forEach(function (k) { scores[k] = 0; });
    return scores;
  }

  function makeSavingThrows() {
    var throws = {};
    ABILITY_KEYS.forEach(function (k) { throws[k] = 0; });
    return throws;
  }

  function makeSkills() {
    return SKILL_NAMES.map(function (name) { return { name: name, modifier: 0 }; });
  }

  function generateId() {
    return 'cr_' + Date.now().toString(36) + '_' + Math.random().toString(36).slice(2, 8);
  }

  function generateCharacterId() {
    return 'char_' + Date.now().toString(36) + '_' + Math.random().toString(36).slice(2, 8);
  }

  function makeClassResource(label, max, type) {
    var resource = { id: generateId(), label: label || 'Ressource de Classe', max: max || 0, type: type === 'counter' ? 'counter' : 'badges', used: [] };
    if (resource.type === 'counter') resource.current = resource.max;
    return resource;
  }

  var DAMAGE_TYPES = ['Tranchant', 'Perforant', 'Contondant'];

  function makeAttack() {
    return { id: generateId(), name: 'Arme', melee: true, rangeMeters: 0, attackBonus: 0, damageDice: '', damageBonus: 0, damageType: '' };
  }

  function defaultProfile() {
    return {
      characterName: 'Mon Personnage',
      hp: { current: 10, max: 10, temp: 0 },
      combatStats: { ac: 10, initiative: 0, speed: 9, spellSaveDc: 10, spellAttackBonus: 0, hitDice: '' },
      spellLevels: makeSpellLevels(),
      classResources: [],
      attacks: [],
      concentration: false,
      inspiration: false,
      abilityScores: makeAbilityScores(),
      savingThrows: makeSavingThrows(),
      skills: makeSkills(),
      favoriteSpells: [],
      gold: 0
    };
  }

  function sanitizeProfile(p) {
    if (typeof p.characterName !== 'string' || !p.characterName) p.characterName = 'Mon Personnage';
    if (typeof p.concentration !== 'boolean') p.concentration = false;
    if (typeof p.inspiration !== 'boolean') p.inspiration = false;
    if (!p.hp || typeof p.hp !== 'object') p.hp = { current: 10, max: 10, temp: 0 };
    if (typeof p.hp.max !== 'number' || isNaN(p.hp.max)) p.hp.max = 10;
    p.hp.max = clamp(p.hp.max, 0, 999);
    if (typeof p.hp.current !== 'number' || isNaN(p.hp.current)) p.hp.current = p.hp.max;
    p.hp.current = clamp(p.hp.current, 0, p.hp.max);
    if (typeof p.hp.temp !== 'number' || isNaN(p.hp.temp)) p.hp.temp = 0;
    p.hp.temp = clamp(p.hp.temp, 0, 999);
    if (!Array.isArray(p.spellLevels) || p.spellLevels.length !== 9) {
      p.spellLevels = makeSpellLevels();
    } else {
      p.spellLevels.forEach(function (l, i) {
        if (typeof l.level !== 'number') l.level = i + 1;
        if (typeof l.enabled !== 'boolean') l.enabled = false;
        if (typeof l.max !== 'number' || isNaN(l.max)) l.max = 0;
        l.max = clamp(l.max, 0, 12);
        l.used = resizeUsedArray(l.used, l.max);
      });
    }
    if (!p.combatStats || typeof p.combatStats !== 'object') p.combatStats = { ac: 10, initiative: 0, speed: 9, spellSaveDc: 10, spellAttackBonus: 0, hitDice: '' };
    if (typeof p.combatStats.ac !== 'number' || isNaN(p.combatStats.ac)) p.combatStats.ac = 10;
    if (typeof p.combatStats.initiative !== 'number' || isNaN(p.combatStats.initiative)) p.combatStats.initiative = 0;
    if (typeof p.combatStats.speed !== 'number' || isNaN(p.combatStats.speed)) p.combatStats.speed = 9;
    if (typeof p.combatStats.spellSaveDc !== 'number' || isNaN(p.combatStats.spellSaveDc)) p.combatStats.spellSaveDc = 10;
    if (typeof p.combatStats.spellAttackBonus !== 'number' || isNaN(p.combatStats.spellAttackBonus)) p.combatStats.spellAttackBonus = 0;
    if (typeof p.combatStats.hitDice !== 'string') p.combatStats.hitDice = '';
    p.combatStats.hitDice = p.combatStats.hitDice.replace(/D/g, 'd');
    if (!p.abilityScores || typeof p.abilityScores !== 'object') p.abilityScores = makeAbilityScores();
    ABILITY_KEYS.forEach(function (k) {
      if (typeof p.abilityScores[k] !== 'number' || isNaN(p.abilityScores[k])) p.abilityScores[k] = 0;
    });
    if (!p.savingThrows || typeof p.savingThrows !== 'object') p.savingThrows = makeSavingThrows();
    ABILITY_KEYS.forEach(function (k) {
      if (typeof p.savingThrows[k] !== 'number' || isNaN(p.savingThrows[k])) p.savingThrows[k] = 0;
    });
    if (!Array.isArray(p.skills) || p.skills.length !== SKILL_NAMES.length) {
      p.skills = makeSkills();
    } else {
      p.skills.forEach(function (s, i) {
        if (typeof s.modifier !== 'number' || isNaN(s.modifier)) s.modifier = 0;
        if (typeof s.name !== 'string') s.name = SKILL_NAMES[i];
      });
    }
    if (!Array.isArray(p.classResources)) {
      if (p.classResource && typeof p.classResource === 'object' && p.classResource.enabled) {
        var oldMax = typeof p.classResource.max === 'number' ? p.classResource.max : 0;
        p.classResources = [{
          id: generateId(),
          label: typeof p.classResource.label === 'string' ? p.classResource.label : 'Ressource de Classe',
          max: oldMax,
          used: resizeUsedArray(p.classResource.used, oldMax)
        }];
      } else {
        p.classResources = [];
      }
    }
    delete p.classResource;
    p.classResources.forEach(function (cr) {
      if (typeof cr.id !== 'string' || !cr.id) cr.id = generateId();
      if (typeof cr.label !== 'string') cr.label = 'Ressource de Classe';
      if (typeof cr.max !== 'number' || isNaN(cr.max)) cr.max = 0;
      if (cr.type !== 'counter') cr.type = 'badges';
      cr.max = Math.max(0, Math.min(cr.type === 'counter' ? 99 : 20, cr.max));
      if (cr.type === 'counter') {
        if (typeof cr.current !== 'number' || isNaN(cr.current)) cr.current = cr.max;
        cr.current = clamp(cr.current, 0, cr.max);
        cr.used = [];
      } else {
        cr.used = resizeUsedArray(cr.used, cr.max);
      }
    });
    if (!Array.isArray(p.attacks)) p.attacks = [];
    p.attacks.forEach(function (atk) {
      if (typeof atk.id !== 'string' || !atk.id) atk.id = generateId();
      if (typeof atk.name !== 'string') atk.name = 'Arme';
      if (typeof atk.melee !== 'boolean') atk.melee = true;
      if (typeof atk.rangeMeters !== 'number' || isNaN(atk.rangeMeters)) atk.rangeMeters = 0;
      atk.rangeMeters = clamp(Math.round(atk.rangeMeters), 0, 999);
      if (typeof atk.attackBonus !== 'number' || isNaN(atk.attackBonus)) atk.attackBonus = 0;
      atk.attackBonus = clamp(Math.round(atk.attackBonus), -99, 99);
      if (typeof atk.damageDice !== 'string') atk.damageDice = '';
      if (typeof atk.damageBonus !== 'number' || isNaN(atk.damageBonus)) atk.damageBonus = 0;
      atk.damageBonus = clamp(Math.round(atk.damageBonus), -99, 99);
      if (typeof atk.damageType !== 'string') atk.damageType = '';
    });
    if (!Array.isArray(p.favoriteSpells)) p.favoriteSpells = [];
    else p.favoriteSpells = p.favoriteSpells.filter(function (n) { return typeof n === 'string'; });
    if (typeof p.gold !== 'number' || isNaN(p.gold)) p.gold = 0;
    p.gold = clamp(Math.round(p.gold), 0, 10000);
    return p;
  }

  var CHARACTER_ORDER = ['calix', 'deneor'];

  function calixDefaultProfile() {
    return sanitizeProfile({
      characterName: 'Calix Noctavel',
      hp: { current: 42, max: 42, temp: 0 },
      combatStats: { ac: 15, initiative: 3, speed: 9 },
      spellLevels: [
        { level: 1, enabled: true, max: 4, used: [false, false, false, false] },
        { level: 2, enabled: true, max: 3, used: [false, false, false] },
        { level: 3, enabled: true, max: 3, used: [false, false, false] },
        { level: 4, enabled: true, max: 1, used: [false] },
        { level: 5, enabled: false, max: 0, used: [] },
        { level: 6, enabled: false, max: 0, used: [] },
        { level: 7, enabled: false, max: 0, used: [] },
        { level: 8, enabled: false, max: 0, used: [] },
        { level: 9, enabled: false, max: 0, used: [] }
      ],
      classResources: [
        { id: 'cr_calix_inspiration', label: 'Inspiration bardique', max: 4, used: [false, false, false, false] }
      ],
      concentration: false,
      inspiration: true,
      abilityScores: { force: -1, dexterite: 2, constitution: 1, intelligence: 2, sagesse: 1, charisme: 4 },
      savingThrows: { force: 1, dexterite: 5, constitution: 1, intelligence: 2, sagesse: 1, charisme: 7 },
      skills: [
        { name: 'Acrobaties', modifier: 3 },
        { name: 'Arcanes', modifier: 8 },
        { name: 'Athlétisme', modifier: 0 },
        { name: 'Discrétion', modifier: 3 },
        { name: 'Dressage', modifier: 2 },
        { name: 'Escamotage', modifier: 3 },
        { name: 'Histoire', modifier: 8 },
        { name: 'Intimidation', modifier: 5 },

  // ---- persistence ----
  function loadState() {
    try {
      var raw = localStorage.getItem(STORAGE_KEY);
      if (!raw) return defaultState();
      var parsed = JSON.parse(raw);
      if (!parsed || !Array.isArray(parsed.profiles) || !parsed.profiles.length) return defaultState();
      parsed.profiles.forEach(sanitizeProfile);
      delete parsed.theme;

      var defaults = defaultCharacters();
      if (!parsed.characters || typeof parsed.characters !== 'object') {
        defaults.calix.savedProfile = cloneDeep(parsed.profiles[0]);
        parsed.characters = defaults;
      } else {
        CHARACTER_ORDER.forEach(function (id) {
          var c = parsed.characters[id];
          if (!c || typeof c !== 'object') { parsed.characters[id] = defaults[id]; return; }
          c.id = id;
          // name/subtitle/level/portrait/theme ne sont éditables nulle part dans l'UI pour Calix/
          // Deneor : toujours resynchronisés depuis les valeurs par défaut du code pour que les
          // corrections de texte (typos, etc.) atteignent aussi les sauvegardes existantes, pas
          // seulement les nouvelles. Ne s'applique pas aux personnages créés dynamiquement
          // (ci-dessous) : eux n'ont pas de valeurs par défaut codées en dur à resynchroniser.
          c.name = defaults[id].name;
          c.subtitle = defaults[id].subtitle;
          c.level = defaults[id].level;
          c.portrait = defaults[id].portrait;
          c.theme = defaults[id].theme;
          if (!c.savedProfile || typeof c.savedProfile !== 'object') c.savedProfile = defaults[id].savedProfile;
          else sanitizeProfile(c.savedProfile);
          if (!c.grimoire || typeof c.grimoire !== 'object' || !Array.isArray(c.grimoire.sections)) c.grimoire = null;
          else sanitizeGrimoire(c.grimoire);
        });
        // Personnages créés dynamiquement (CRUD local, août 2026) : mêmes garanties de forme que
        // Calix/Deneor sur savedProfile/grimoire, mais sans resynchronisation de l'identité — elle
        // n'existe que dans state, il n'y a pas de "défaut code" vers lequel revenir.
        Object.keys(parsed.characters).forEach(function (id) {
          if (CHARACTER_ORDER.indexOf(id) !== -1) return;
          var c = parsed.characters[id];
          if (!c || typeof c !== 'object') { delete parsed.characters[id]; return; }
          c.id = id;
          if (typeof c.name !== 'string' || !c.name) c.name = 'Nouveau personnage';
          if (typeof c.subtitle !== 'string') c.subtitle = '';
          if (typeof c.level !== 'number') c.level = null;
          if (typeof c.portrait !== 'string' || !c.portrait) c.portrait = null;
          if (typeof c.theme !== 'string') c.theme = 'calix';
          if (!c.savedProfile || typeof c.savedProfile !== 'object') c.savedProfile = defaultProfile();
          sanitizeProfile(c.savedProfile);
          if (!c.grimoire || typeof c.grimoire !== 'object' || !Array.isArray(c.grimoire.sections)) c.grimoire = null;
          else sanitizeGrimoire(c.grimoire);
        });
      }

      var knownIds = Object.keys(parsed.characters);
      if (!Array.isArray(parsed.characterOrder)) {
        parsed.characterOrder = CHARACTER_ORDER.filter(function (id) { return knownIds.indexOf(id) !== -1; });
      } else {
        parsed.characterOrder = parsed.characterOrder.filter(function (id) { return knownIds.indexOf(id) !== -1; });
      }
      // Filet de sécurité : tout personnage présent dans state.characters mais absent de l'ordre
      // (ex. characterOrder corrompu/tronqué) reste accessible plutôt que de disparaître de la nav.
      knownIds.forEach(function (id) { if (parsed.characterOrder.indexOf(id) === -1) parsed.characterOrder.push(id); });
      if (!parsed.characterOrder.length) parsed.characterOrder = CHARACTER_ORDER.slice();

      if (parsed.characterOrder.indexOf(parsed.activeCharacterId) === -1) parsed.activeCharacterId = parsed.characterOrder[0];
      return parsed;
    } catch (e) {
      return defaultState();
    }
  }

  function fbEnsureAuth() {

      fbRequestAccess(result.user);

  function makeGrimoireSpell() {

  function makeGrimoireSection() {
    return { title: 'Nouvelle section', levelTag: 'Niv. 1', level: 1, spells: [] };
  }
  var EMPTY_GRIMOIRE = { sections: [] };

  // Normalise la forme d'un grimoire (sections/sorts), que ce soit au chargement de state ou pour
  // le brouillon de l'éditeur "Paramétrer le Grimoire" — pas d'id sur les sections/sorts (adressage par
  // index dans le tableau), même convention que cantrip-admin.html.
  function sanitizeGrimoire(g) {
    if (!g || typeof g !== 'object' || !Array.isArray(g.sections)) return cloneDeep(EMPTY_GRIMOIRE);
    g.sections.forEach(function (s) {
      if (typeof s.title !== 'string') s.title = '';
      if (typeof s.levelTag !== 'string') s.levelTag = '';
      if (s.level !== 'classe' && (typeof s.level !== 'number' || isNaN(s.level))) s.level = 0;
      if (typeof s.level === 'number') s.level = clamp(Math.round(s.level), 0, 9);
      if (!Array.isArray(s.spells)) s.spells = [];
      s.spells.forEach(function (sp) {
        if (typeof sp.name !== 'string') sp.name = '';
        if (typeof sp.type !== 'string') sp.type = '';
        if (typeof sp.range !== 'string') sp.range = '';
        if (typeof sp.desc !== 'string') sp.desc = '';
        if (typeof sp.note !== 'string') sp.note = '';
      });
    });
    return g;
  }

  // Grimoire d'un personnage : celui chargé depuis Firebase ou édité en jeu (state.characters[id]
  // .grimoire) s'il existe, sinon le contenu par défaut codé en dur pour Calix/Deneor (SPELLBOOK/
  // DENEOR_SPELLBOOK), sinon un grimoire vide (futurs personnages créés dynamiquement — un ID
  // inconnu ne doit jamais retomber sur le grimoire d'un des deux personnages historiques).
  function characterGrimoire(charId) {
    var loaded = state.characters[charId] && state.characters[charId].grimoire;
    if (loaded && Array.isArray(loaded.sections)) return loaded;
    if (charId === 'calix') return SPELLBOOK;
    if (charId === 'deneor') return DENEOR_SPELLBOOK;
    return EMPTY_GRIMOIRE;
  }

  function activeSpellbook() {
    return characterGrimoire(state.activeCharacterId);

  // Cherche un sort par nom dans tout le grimoire d'un personnage (toutes sections confondues),
  // pour la popup de détail (renderSpellDetailModal()) — les noms de sorts sont uniques au sein

  function findSpellDetail(charId, name) {
    var sections = characterGrimoire(charId).sections;
    for (var i = 0; i < sections.length; i++) {
      var spells = sections[i].spells;
      for (var j = 0; j < spells.length; j++) {
        if (spells[j].name === name) return { spell: spells[j], levelTag: sections[i].levelTag };

  function renderTrackerBlock(label, blockKey, bodyHtml) {

  // Grille de 5 colonnes égales invisibles (grid-template-columns partagé par toutes les lignes,
  // donc les valeurs s'alignent verticalement d'une arme à l'autre) : Nom en occupe 3, Toucher 1,
  // Dégâts 1 (grid-column, pas 5 divs séparées). La colonne Dégâts empile dés et type sur deux
  // lignes plutôt que côte à côte, pour que le type (ex. "Contondant") s'affiche toujours en
  // entier sans ellipsis, et reste centrée horizontalement et verticalement dans sa colonne
  // (juillet 2026, alignement demandé par l'utilisateur après plusieurs itérations).
  function renderAttackRow(atk) {
    var rangeSuffix = (!atk.melee && atk.rangeMeters > 0)
      ? ' <span style="font-size:16.5px;font-weight:400;color:var(--text-muted)">(' + atk.rangeMeters + 'm)</span>'
      : '';
    var diceText = atk.damageDice ? (escapeHtml(atk.damageDice) + (atk.damageBonus ? formatSigned(atk.damageBonus) : '')) : '';
    var typeText = atk.damageType ? escapeHtml(atk.damageType) : '';
    return '<div style="display:grid;grid-template-columns:repeat(5,1fr);align-items:center;gap:6px;padding:9px 0">' +
      '<div style="grid-column:span 3;display:flex;align-items:center;gap:6px;min-width:0">' +
        '<div style="flex:none;width:16px;height:16px;color:var(--text-muted)">' + (atk.melee ? iconSword() : iconBow()) + '</div>' +
        '<div style="min-width:0;font-size:18.75px;font-weight:600;color:var(--text-main);white-space:nowrap;overflow:hidden;text-overflow:ellipsis">' + escapeHtml(atk.name) + rangeSuffix + '</div>' +
      '</div>' +
      '<div style="grid-column:span 1;display:flex;align-items:center;justify-content:center;gap:4px;min-width:0">' +
        '<div style="flex:none;width:14px;height:14px;color:var(--text-muted)">' + ICON_TARGET + '</div>' +
        '<div style="flex:none;font-size:21px;color:var(--accent-blue-text);font-weight:700">' + formatSigned(atk.attackBonus) + '</div>' +
      '</div>' +
      '<div style="grid-column:span 1;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;min-width:0">' +
        (diceText ? '<div style="font-size:18.75px;font-weight:600;color:var(--text-main);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-align:center">' + diceText + '</div>' : '') +
        (typeText ? '<div style="font-size:16.5px;color:var(--text-muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-align:center">' + typeText + '</div>' : '') +
      '</div>' +
    '</div>';
  }

  // Avatar d'un personnage (Tracker, carrousel "Charger un personnage") : portrait statique s'il
  // existe (Calix/Deneor uniquement — les personnages créés dynamiquement n'ont pas de fichier
  // portrait), sinon une icône générique dans un cercle teinté, pour qu'un personnage tout juste
  // créé ne laisse pas un espace vide à la place de l'avatar.
  function renderCharacterAvatar(character, size, extraStyle) {
    var s = size || 38;
    if (character && character.portrait) {
      return '<img src="' + escapeHtml(character.portrait) + '" alt="" draggable="false" style="flex:none;width:' + s + 'px;height:' + s + 'px;border-radius:50%;object-fit:cover;border:1px solid rgba(var(--border-tint),0.35);' + (extraStyle || '') + '"/>';
    }
    return '<div style="flex:none;width:' + s + 'px;height:' + s + 'px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:rgba(var(--border-tint),0.16);border:1px solid rgba(var(--border-tint),0.35);color:var(--text-muted);' + (extraStyle || '') + '">' + iconCharacter(false, Math.round(s * 0.5)) + '</div>';
  }

  function renderTracker() {
    var p = profile();
    var hp = p.hp;
    var activeCharacter = state.characters[state.activeCharacterId];

    var maxHtml = ui.editingMax
      ? '<input id="hpMaxInput" type="text" inputmode="numeric" pattern="[0-9]*" value="' + hp.max + '" style="width:60px;font-size:19px;color:var(--text-main);background:transparent;border:none;border-bottom:1px solid #ef4444;outline:none;padding:0"/>'
      : '<div id="hpMaxDisplay" style="font-size:19px;color:var(--text-muted);cursor:pointer;border-bottom:1px dashed var(--border-strong)">' + hp.max + '</div>';

    var tempHtml;
    if (ui.editingTemp) {
      tempHtml = '<div style="display:flex;align-items:baseline;gap:2px;margin-left:8px">' +
        '<div style="font-size:19px;font-weight:700;color:var(--accent-blue-text)">+</div>' +
        '<input id="tempInput" type="text" inputmode="numeric" pattern="[0-9]*" value="' + hp.temp + '" style="width:44px;font-size:19px;font-weight:700;color:var(--accent-blue-text);background:transparent;border:none;border-bottom:1px solid var(--accent-blue-text);outline:none;padding:0"/></div>';
    } else {
      tempHtml = '<div id="tempDisplay" style="font-size:19px;font-weight:700;color:var(--accent-blue-text);cursor:pointer;border-bottom:1px dashed rgba(125,211,252,0.5);margin-left:8px">+' + hp.temp + '</div>';
    }

    var spellGroupsHtml = p.spellLevels
      .filter(function (l) { return l.enabled && l.max > 0; })
      .map(function (l) {
        var total = l.used.length;
        var availableCount = l.used.filter(function (used) { return !used; }).length;
        var canDec = availableCount > 0;
        var canInc = availableCount < total;
        var dots = l.used.map(function (used, i) {
          var filled = !used;
          return '<div data-action="toggle-spell" data-level="' + l.level + '" data-index="' + i + '" style="flex:none;width:27px;height:27px;border-radius:50%;cursor:pointer;box-sizing:border-box;' +
            (filled
              ? 'background:var(--text-gold);border:2px solid var(--text-gold)'
              : 'background:transparent;border:2px solid rgba(var(--border-tint),0.35)') +
            '"></div>';
        }).join('');
        var slotBtn = function (action, disabled, symbol) {
          return '<div data-action="' + action + '" data-level="' + l.level + '" style="flex:none;width:46px;height:46px;border-radius:11px;background:' + (disabled ? 'transparent' : 'var(--bg-card-alt)') + ';border:1px solid rgba(var(--border-tint),' + (disabled ? '0.12' : '0.32') + ');color:' + (disabled ? 'var(--text-dim)' : 'var(--text-main)') + ';font-size:23px;font-weight:700;display:flex;align-items:center;justify-content:center;cursor:' + (disabled ? 'default' : 'pointer') + ';user-select:none;pointer-events:' + (disabled ? 'none' : 'auto') + '">' + symbol + '</div>';
        };
        return '<div style="display:flex;align-items:center;gap:6px">' +
          '<div style="flex:none;width:28px;font-size:11px;font-weight:600;color:var(--text-label);white-space:nowrap">Niv.' + l.level + '</div>' +
          slotBtn('spell-slot-dec', !canDec, '&minus;') +
          '<div class="hscroll" style="flex:1;min-width:0;display:flex;gap:6px;overflow-x:auto;justify-content:safe center;padding:2px 0">' + dots + '</div>' +
          slotBtn('spell-slot-inc', !canInc, '+') +
          '<div style="flex:none;width:34px;text-align:right;font-size:12px;color:var(--text-muted);font-variant-numeric:tabular-nums">' + availableCount + '/' + total + '</div>' +
          '</div>';
      }).join('<div style="height:2px"></div>');

    var attacksBodyHtml = p.attacks.map(function (atk, i) {
      return (i > 0 ? '<hr style="border:none;border-top:1px solid rgba(var(--border-tint),0.14);margin:0">' : '') + renderAttackRow(atk);
    }).join('');

    var attacksHtml = p.attacks.length ? renderTrackerBlock('Attaque', 'attacks', attacksBodyHtml) : '';

    var classResourcesHtml = p.classResources.map(function (cr) {
      if (cr.type === 'counter') {
        var counterCanDec = cr.current > 0;
        var counterCanInc = cr.current < cr.max;
        var counterBtn = function (action, disabled, symbol) {
          return '<div data-action="' + action + '" data-id="' + cr.id + '" style="flex:none;width:46px;height:46px;border-radius:11px;background:' + (disabled ? 'transparent' : 'var(--bg-card-alt)') + ';border:1px solid rgba(var(--border-tint),' + (disabled ? '0.12' : '0.32') + ');color:' + (disabled ? 'var(--text-dim)' : 'var(--text-main)') + ';font-size:23px;font-weight:700;cursor:' + (disabled ? 'default' : 'pointer') + ';display:flex;align-items:center;justify-content:center;user-select:none;pointer-events:' + (disabled ? 'none' : 'auto') + '">' + symbol + '</div>';
        };
        return '<div style="display:flex;flex-direction:column;gap:6px">' +
          '<div style="font-size:12px;font-weight:600;color:var(--text-label);text-transform:uppercase;letter-spacing:0.08em;text-align:center">' + escapeHtml(cr.label || 'Ressource') + '</div>' +
          '<div style="display:flex;align-items:center;justify-content:center;gap:10px">' +
            counterBtn('counter-dec', !counterCanDec, '&minus;') +
            '<div style="font-size:17px;font-weight:700;color:var(--text-main);min-width:52px;text-align:center">' + cr.current + ' / ' + cr.max + '</div>' +
            counterBtn('counter-inc', !counterCanInc, '+') +
          '</div>' +
          '</div>';
      }
      var crTotal = cr.used.length;
      var crAvailableCount = cr.used.filter(function (used) { return !used; }).length;
      var crCanDec = crAvailableCount > 0;
      var crCanInc = crAvailableCount < crTotal;
      var cbadges = cr.used.map(function (used, i) {
        var filled = !used;
        return '<div data-action="toggle-class" data-id="' + cr.id + '" data-index="' + i + '" style="flex:none;width:27px;height:27px;border-radius:50%;cursor:pointer;box-sizing:border-box;' +
          (filled
            ? 'background:var(--text-gold);border:2px solid var(--text-gold)'
            : 'background:transparent;border:2px solid rgba(var(--border-tint),0.35)') +
          '"></div>';
      }).join('');
      var classSlotBtn = function (action, disabled, symbol) {
        return '<div data-action="' + action + '" data-id="' + cr.id + '" style="flex:none;width:46px;height:46px;border-radius:11px;background:' + (disabled ? 'transparent' : 'var(--bg-card-alt)') + ';border:1px solid rgba(var(--border-tint),' + (disabled ? '0.12' : '0.32') + ');color:' + (disabled ? 'var(--text-dim)' : 'var(--text-main)') + ';font-size:23px;font-weight:700;display:flex;align-items:center;justify-content:center;cursor:' + (disabled ? 'default' : 'pointer') + ';user-select:none;pointer-events:' + (disabled ? 'none' : 'auto') + '">' + symbol + '</div>';
      };
      // En dessous de 3 emplacements, les boutons -/+ n'apportent rien (autant taper directement
      // sur l'unique/les deux badges) et prennent plus de place que la ressource elle-même : ils
      // ne s'affichent qu'à partir de 3, au bord de la carte comme pour les emplacements de sorts.
      // Les deux marges (vides ici, 28px puis 34px) reproduisent la largeur du libellé "Niv.N" et
      // du compteur "x/x" de la rangée d'emplacements de sorts, pour que les pastilles des deux
      // blocs restent alignées verticalement d'une carte à l'autre malgré leurs contenus différents.
      var badgesRowHtml = cr.used.length >= 3
        ? '<div style="display:flex;align-items:center;gap:6px">' +
            '<div style="flex:none;width:28px"></div>' +
            classSlotBtn('class-badge-dec', !crCanDec, '&minus;') +
            '<div class="hscroll" style="flex:1;min-width:0;display:flex;gap:6px;overflow-x:auto;justify-content:safe center;padding:2px 0">' + cbadges + '</div>' +
            classSlotBtn('class-badge-inc', !crCanInc, '+') +
            '<div style="flex:none;width:34px"></div>' +
          '</div>'
        : '<div class="hscroll" style="display:flex;gap:8px;overflow-x:auto;justify-content:safe center;padding:2px 0">' + cbadges + '</div>';
      return '<div style="display:flex;flex-direction:column;gap:6px">' +
        '<div style="font-size:12px;font-weight:600;color:var(--text-label);text-transform:uppercase;letter-spacing:0.08em;text-align:center">' + escapeHtml(cr.label || 'Ressource') + '</div>' +
        badgesRowHtml +
        '</div>';
    }).join('<div style="height:10px"></div>');

    var classHtml = p.classResources.length ? renderTrackerBlock('Ressources', 'resources', classResourcesHtml) : '';

    var spellSlotsBodyHtml = spellGroupsHtml || '<div style="font-size:12px;color:var(--text-dim)">Aucun niveau actif - configurez-les dans les paramètres.</div>';
    var spellSlotsHtml = renderTrackerBlock('Emplacements de sorts', 'spellSlots', spellSlotsBodyHtml);

    var combatStatsHtml = [
      { key: 'ac', label: 'CA', display: p.combatStats.ac, inputValue: p.combatStats.ac, inputMode: 'numeric', pattern: '[0-9]*' },
      { key: 'initiative', label: 'Initiative', display: formatSigned(p.combatStats.initiative), inputValue: formatSigned(p.combatStats.initiative), inputMode: 'text', pattern: '-?[0-9]*' },
      { key: 'speed', label: 'Déplacement', display: p.combatStats.speed + 'm', inputValue: p.combatStats.speed, inputMode: 'numeric', pattern: '[0-9]*' },
      { key: 'spellSaveDc', label: 'DD Sauv', display: p.combatStats.spellSaveDc, inputValue: p.combatStats.spellSaveDc, inputMode: 'numeric', pattern: '[0-9]*' },
      { key: 'spellAttackBonus', label: 'Sorts', display: formatSigned(p.combatStats.spellAttackBonus), inputValue: formatSigned(p.combatStats.spellAttackBonus), inputMode: 'text', pattern: '-?[0-9]*' },
      { key: 'hitDice', label: 'Dés de vie', display: escapeHtml(p.combatStats.hitDice) || '—', inputValue: escapeHtml(p.combatStats.hitDice), inputMode: 'text', pattern: '.*' }
    ].map(function (stat) {
      // Cinzel n'a pas de vrai "d" bas-de-casse (ses minuscules ressemblent à des petites
      // capitales) : "8d10" y ressemble visuellement à "8D10". On sort donc les dés de vie de
      // cette police pour que le "d" reste lisiblement minuscule.
      var fontClass = stat.key === 'hitDice' ? '' : 'font-cinzel';
      var valueHtml = ui.editingCombatStat === stat.key
        ? '<input id="combatStatInput" data-key="' + stat.key + '" type="text" inputmode="' + stat.inputMode + '" pattern="' + stat.pattern + '" value="' + stat.inputValue + '" style="width:100%;font-size:17px;font-weight:700;color:var(--text-gold);background:transparent;border:none;border-bottom:1px solid var(--text-gold);outline:none;padding:0;text-align:center;box-sizing:border-box" class="' + fontClass + '"/>'
        : '<div data-action="edit-combat-stat" data-key="' + stat.key + '" style="font-size:17px;font-weight:700;color:var(--text-gold);cursor:pointer;border-bottom:1px dashed transparent" class="' + fontClass + '">' + stat.display + '</div>';
      return '<div style="display:flex;flex-direction:column;align-items:center;gap:2px;background:var(--bg-card);border:1px solid rgba(var(--border-tint),0.2);border-radius:10px;padding:7px 6px">' +
        '<div style="font-size:9px;color:var(--text-muted);text-transform:uppercase;letter-spacing:0.04em">' + stat.label + '</div>' +
        valueHtml +
        '</div>';
    }).join('');

    return (
      '<div style="display:flex;flex-direction:column;height:100%;gap:14px">' +
        '<div style="display:flex;align-items:center;justify-content:space-between;gap:8px">' +
          '<div style="display:flex;align-items:center;gap:10px;flex:1;min-width:0">' +
            renderCharacterAvatar(activeCharacter, 38) +
            '<div style="font-size:21px;font-weight:700;letter-spacing:0.3px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap" class="font-cinzel">' + escapeHtml(p.characterName) + '</div>' +
          '</div>' +
          '<div style="display:flex;align-items:center;gap:10px;flex:none">' +
            '<div data-action="toggle-inspiration" title="Point d\'inspiration" style="flex:none;width:40px;height:40px;border-radius:10px;display:flex;align-items:center;justify-content:center;cursor:pointer;color:' + (p.inspiration ? 'var(--accent-gold-badge-text)' : 'var(--text-dim)') + ';background:' + (p.inspiration ? 'rgba(234,179,8,0.18)' : 'transparent') + ';border:1px solid ' + (p.inspiration ? 'rgba(234,179,8,0.6)' : 'rgba(var(--border-tint),0.25)') + '">' + ICON_D20 + '</div>' +
            '<div data-action="toggle-concentration" class="' + (p.concentration ? 'concentration-active' : '') + '" title="Concentration" style="flex:none;width:40px;height:40px;border-radius:10px;display:flex;align-items:center;justify-content:center;cursor:pointer;color:' + (p.concentration ? 'var(--accent-purple-solid)' : 'var(--text-dim)') + ';background:' + (p.concentration ? 'rgba(167,139,250,0.18)' : 'transparent') + ';border:1px solid ' + (p.concentration ? 'rgba(167,139,250,0.6)' : 'rgba(var(--border-tint),0.25)') + '">' + ICON_CONCENTRATION + '</div>' +
          '</div>' +
        '</div>' +

        '<div class="' + (p.concentration ? 'hp-concentration-ring' : '') + '" style="background:var(--bg-card);border:1px solid rgba(var(--border-tint),0.2);border-radius:16px;padding:14px 16px;display:flex;align-items:center;gap:16px">' +
          '<div data-action="damage" style="flex:none;width:80px;height:76px;border-radius:6px;background:rgba(239,68,68,0.15);border:1px solid rgba(239,68,68,0.45);color:#ef4444;font-size:28px;font-weight:700;cursor:pointer;display:flex;align-items:center;justify-content:center;user-select:none">&minus;</div>' +
          '<div style="flex:1;min-width:0;display:flex;flex-direction:column;gap:10px;align-items:center;text-align:center">' +
            '<div style="font-size:12px;font-weight:600;color:var(--text-label);text-transform:uppercase;letter-spacing:0.08em">Points de vie</div>' +
            '<div style="display:flex;align-items:baseline;justify-content:center;gap:6px;flex-wrap:wrap">' +
              '<div style="font-size:42px;font-weight:800;line-height:1">' + hp.current + '</div>' +
              '<div style="font-size:19px;color:var(--text-muted)">/</div>' +
              maxHtml +
              tempHtml +
            '</div>' +
            (function () {
              var currentPct = hp.max > 0 ? clamp(Math.round(hp.current / hp.max * 100), 0, 100) : 0;
              var tempPct = hp.max > 0 ? clamp(Math.round(hp.temp / hp.max * 100), 0, currentPct) : 0;
              return '<div style="width:100%;height:5px;border-radius:3px;background:rgba(239,68,68,0.35);overflow:hidden;position:relative">' +
                '<div style="height:100%;width:' + currentPct + '%;background:#22c55e"></div>' +
                (tempPct > 0 ? '<div style="position:absolute;top:0;right:' + (100 - currentPct) + '%;width:' + tempPct + '%;height:100%;background:var(--accent-blue-text)"></div>' : '') +
              '</div>';
            })() +
          '</div>' +
          '<div data-action="heal" style="flex:none;width:80px;height:76px;border-radius:6px;background:rgba(34,197,94,0.15);border:1px solid rgba(34,197,94,0.45);color:#22c55e;font-size:28px;font-weight:700;cursor:pointer;display:flex;align-items:center;justify-content:center;user-select:none">+</div>' +
        '</div>' +

        '<div data-scroll-root style="flex:1;min-height:0;overflow-y:auto;display:flex;flex-direction:column;gap:14px;padding-right:2px;margin-top:10px">' +
          attacksHtml +
          classHtml +
          spellSlotsHtml +

          '<div style="display:grid;grid-template-columns:repeat(3,1fr);gap:8px;flex:none">' + combatStatsHtml + '</div>' +

          '<div data-action="open-rest" style="flex:none;height:52px;border-radius:6px;background:var(--border-strong);border:1px solid rgba(var(--border-tint),0.34);color:var(--ink-bright);font-size:15px;font-weight:600;cursor:pointer;display:flex;align-items:center;justify-content:center;user-select:none;letter-spacing:0.03em" class="font-cinzel">Repos</div>' +
        '</div>' +
      '</div>'
    );
  }

  function renderStats() {
    var p = profile();
    var search = ui.statsSearch || '';
    var searchLower = search.toLowerCase();
    function skillMatchRank(name) {
      var n = name.toLowerCase();
      if (n === searchLower) return 0;
      if (n.indexOf(searchLower) === 0) return 1;
      return 2;
    }
    var filteredSkills = p.skills
      .filter(function (s) { return s.name.toLowerCase().indexOf(searchLower) !== -1; })
      .sort(function (a, b) { return skillMatchRank(a.name) - skillMatchRank(b.name); });

    var abilitiesHtml = ABILITY_KEYS.map(function (key) {
      return '<div style="position:relative;height:90px;background:var(--bg-card);border:1px solid rgba(var(--border-tint),0.2);border-radius:10px;overflow:hidden">' +
        '<div style="position:absolute;inset:0;clip-path:polygon(100% 0,100% 100%,0 100%);background:var(--bg-card-alt)"></div>' +
        '<svg width="100%" height="100%" viewBox="0 0 100 100" preserveAspectRatio="none" style="position:absolute;inset:0"><line x1="0" y1="100" x2="100" y2="0" style="stroke:rgba(var(--border-tint),0.4)" stroke-width="1" vector-effect="non-scaling-stroke"/></svg>' +
        '<div style="position:absolute;top:6px;left:8px;display:flex;flex-direction:column;align-items:flex-start;gap:0px">' +
          '<div style="font-size:11px;font-weight:700;color:var(--text-muted);text-transform:uppercase;letter-spacing:0.03em">' + ABILITY_LABELS[key] + '</div>' +
          '<div style="font-size:22px;line-height:1;font-weight:700;color:var(--text-gold)" class="font-cinzel">' + formatSigned(p.abilityScores[key]) + '</div>' +
        '</div>' +
        '<div style="position:absolute;bottom:6px;right:8px;display:flex;flex-direction:column;align-items:flex-end;gap:0px">' +
          '<div style="font-size:22px;line-height:1;color:var(--text-gold)" class="font-cinzel">' + formatSigned(p.savingThrows[key]) + '</div>' +
          '<div style="font-size:9px;color:var(--text-muted);text-transform:uppercase;letter-spacing:0.03em">Sauv.</div>' +
        '</div>' +
        '</div>';
    }).join('');

    var skillsHtml = filteredSkills.length
      ? filteredSkills.map(function (s, i) {
          return '<div style="display:flex;align-items:center;justify-content:space-between;padding:14px 16px;background:' + (i % 2 ? 'var(--bg-card-alt)' : 'var(--bg-card)') + ';border-bottom:1px solid rgba(var(--border-tint),0.14)">' +
            '<div style="font-size:15px;color:var(--text-main)">' + escapeHtml(s.name) + '</div>' +
            '<div style="font-size:16px;font-weight:700;color:var(--text-gold)">' + formatSigned(s.modifier) + '</div>' +
            '</div>';
        }).join('')
      : '<div style="padding:16px;text-align:center;font-size:12px;color:var(--text-dim)">Aucune compétence trouvée.</div>';

    return (
      '<div style="display:flex;flex-direction:column;height:100%;gap:14px;position:relative">' +
        '<div style="display:flex;align-items:center;justify-content:space-between;gap:8px;flex:none">' +
          '<div style="font-size:21px;font-weight:700;letter-spacing:0.3px" class="font-cinzel">Personnage</div>' +
          '<div id="statsGoldBadge" data-action="open-gold-modal" style="display:flex;align-items:center;gap:6px;height:32px;padding:0 12px;border-radius:16px;background:rgba(var(--border-tint),0.14);border:1px solid rgba(var(--border-tint),0.35);color:var(--text-gold);font-size:13px;font-weight:700;cursor:pointer;user-select:none" class="font-cinzel">Or : ' + p.gold + ' PO</div>' +
        '</div>' +
        '<input id="statsSearchInput" type="text" value="' + escapeHtml(search) + '" placeholder="Rechercher" style="flex:none;height:52px;background:var(--bg-card);border:1px solid rgba(var(--border-tint),0.24);border-radius:10px;color:var(--text-main);font-size:16px;padding:0 16px;box-sizing:border-box"/>' +
        '<div id="statsAbilitiesBlock" style="flex:none">' +
          '<div style="font-size:11px;color:var(--text-label);text-transform:uppercase;letter-spacing:0.06em;margin-bottom:8px">Caractéristiques</div>' +
          '<div style="display:grid;grid-template-columns:repeat(3,1fr);gap:8px">' + abilitiesHtml + '</div>' +
        '</div>' +
        '<div style="flex:1;min-height:0;display:flex;flex-direction:column;gap:8px">' +
          '<div style="font-size:11px;color:var(--text-label);text-transform:uppercase;letter-spacing:0.06em;flex:none">Compétences</div>' +
          '<div data-scroll-root style="flex:1;min-height:0;overflow-y:auto;border-radius:12px;border:1px solid rgba(var(--border-tint),0.2)">' + skillsHtml + '</div>' +
        '</div>' +
        '<div id="statsResetBtn" data-action="reset-stats-view" style="position:absolute;top:0;right:0;width:36px;height:36px;border-radius:8px;background:var(--bg-card);border:1px solid rgba(var(--border-tint),0.24);display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--text-main);opacity:0;pointer-events:none;transition:opacity 150ms ease-out;z-index:5">' + iconClose() + '</div>' +
      '</div>'
    );
  }

  function maxEnabledSpellLevel() {
    var enabledLevels = profile().spellLevels.filter(function (l) { return l.enabled; }).map(function (l) { return l.level; });
    return enabledLevels.length ? Math.max.apply(null, enabledLevels) : 0;
  }

  function grimoireTabs() {
    var tabs = [];
    var hasLevelZero = activeSpellbook().sections.some(function (s) { return s.level === 0 && s.spells.length > 0; });
    for (var i = hasLevelZero ? 0 : 1; i <= maxEnabledSpellLevel(); i++) tabs.push(i);
    tabs.push('classe');
    return tabs;
  }

  function grimoireTabLabel(tab) {
    return tab === 'classe' ? 'Classe' : String(tab);
  }

  // Popup de détail d'un sort (tap sur une ligne du Grimoire) — même
  // principe enter/leave animé que le portrait agrandi du Codex (ui.spellDetail.leaving +
  // render() immédiat, puis un setTimeout dont la durée matche l'animation CSS de sortie avant de
  // vider l'état pour de bon). Reprend les mêmes informations que la ligne (nom, niveau, type,
  // portée, description, note) mais sans troncature.
  function renderSpellDetailModal() {
    var entering = ui.spellDetailEnterPending;
    ui.spellDetailEnterPending = false;
    var leaving = ui.spellDetail.leaving;
    var backdropAnim = leaving ? 'spell-detail-backdrop-leave' : (entering ? 'spell-detail-backdrop-enter' : '');
    var cardAnim = leaving ? 'spell-detail-card-leave' : (entering ? 'spell-detail-card-enter' : '');
    var spell = ui.spellDetail.spell;
    var levelTag = ui.spellDetail.levelTag;
    return '<div class="spell-detail-backdrop ' + backdropAnim + '" data-action="close-spell-detail">' +
      '<div class="spell-detail-card ' + cardAnim + '">' +
        '<div style="display:flex;align-items:flex-start;justify-content:space-between;gap:10px">' +
          '<div style="font-size:18px;font-weight:700;color:var(--text-main);font-family:\'Cinzel\',serif;line-height:1.25">' + escapeHtml(spell.name) + '</div>' +
          '<div data-action="close-spell-detail" style="flex:none;width:32px;height:32px;border-radius:16px;background:rgba(var(--border-tint),0.14);border:1px solid rgba(var(--border-tint),0.3);display:flex;align-items:center;justify-content:center;color:var(--text-main);cursor:pointer">' + iconClose() + '</div>' +
        '</div>' +
        '<div style="display:flex;align-items:center;gap:6px;flex-wrap:wrap">' +
          '<div style="background:rgba(var(--border-tint),0.12);border:1px solid rgba(var(--border-tint),0.32);color:var(--text-chip);padding:3px 8px;border-radius:6px;font-size:11px;font-weight:700">' + escapeHtml(levelTag) + '</div>' +
          '<div style="' + spellBadgeStyle(spell.type) + 'padding:3px 9px;border-radius:6px;font-size:11px;font-weight:700;letter-spacing:0.03em">' + escapeHtml(spell.type) + '</div>' +
        '</div>' +
        '<div style="font-size:12.5px;color:var(--text-muted)">' + escapeHtml(spell.range) + '</div>' +
        '<div style="font-size:14px;color:var(--text-desc);line-height:1.5">' + escapeHtml(spell.desc) + '</div>' +
        (spell.note ? '<div style="font-size:12.5px;color:var(--text-note);font-style:italic;line-height:1.4;border-top:1px solid rgba(var(--border-tint),0.16);padding-top:10px">' + escapeHtml(spell.note) + '</div>' : '') +
      '</div>' +
    '</div>';
  }

  // Popup d'édition d'un sort dans "Paramétrer le Grimoire" (tap sur une ligne compacte pendant
  // l'édition, ui.grimoireSpellEdit). Même gabarit visuel et même animation enter/leave que
  // renderSpellDetailModal (réutilise les classes CSS spell-detail-backdrop/-card), mais contient
  // de vrais champs de saisie — donc, contrairement à la popup de lecture, le fond n'a volontairement
  // pas de data-action="close..." (un tap dans un champ bulle jusqu'au fond et le fermerait sinon,
  // aucun stopPropagation ne rattraperait ça) : fermeture uniquement via la croix ou le bouton
  // "Terminé", même convention que les modales Créer/Supprimer un personnage. Les champs réutilisent
  // tels quels les data-action grimoire-spell-name/-type/-range/-desc/-note déjà câblés dans
  // bindEvents() pour le formulaire inline historique — bindEvents() est ré-exécuté après l'ajout de
  // cette popup au DOM (voir render()), donc ces listeners s'attachent aussi à ses champs.
  function renderGrimoireSpellEditModal() {
    var st = ui.grimoireSpellEdit;
    var g = settingsGrimoireData();
    var section = g.sections[st.sectionIndex];
    var spell = section && section.spells[st.spellIndex];
    if (!spell) return '';
    var entering = ui.grimoireSpellEditEnterPending;
    ui.grimoireSpellEditEnterPending = false;
    var leaving = st.leaving;
    var backdropAnim = leaving ? 'spell-detail-backdrop-leave' : (entering ? 'spell-detail-backdrop-enter' : '');
    var cardAnim = leaving ? 'spell-detail-card-leave' : (entering ? 'spell-detail-card-enter' : '');
    var sIdx = st.sectionIndex, spIdx = st.spellIndex;
    return '<div class="spell-detail-backdrop ' + backdropAnim + '">' +
      '<div class="spell-detail-card ' + cardAnim + '">' +
        '<div style="display:flex;align-items:flex-start;gap:10px">' +
          '<input type="text" data-action="grimoire-spell-name" data-section-index="' + sIdx + '" data-spell-index="' + spIdx + '" value="' + escapeHtml(spell.name) + '" placeholder="Nom du sort" style="flex:1;min-width:0;height:38px;background:var(--bg-deep);border:1px solid rgba(var(--border-tint),0.24);border-radius:8px;color:var(--text-main);font-size:15px;font-weight:700;padding:0 10px;box-sizing:border-box;font-family:\'Cinzel\',serif"/>' +
          '<div data-action="close-grimoire-spell-edit" style="flex:none;width:32px;height:32px;border-radius:16px;background:rgba(var(--border-tint),0.14);border:1px solid rgba(var(--border-tint),0.3);display:flex;align-items:center;justify-content:center;color:var(--text-main);cursor:pointer">' + iconClose() + '</div>' +
        '</div>' +
        '<div style="display:grid;grid-template-columns:1fr 1fr;gap:8px">' +
          '<div style="display:flex;flex-direction:column;gap:4px;min-width:0">' +
            '<label style="font-size:10px;color:var(--text-muted)">Type</label>' +
            '<input type="text" data-action="grimoire-spell-type" data-section-index="' + sIdx + '" data-spell-index="' + spIdx + '" value="' + escapeHtml(spell.type) + '" placeholder="ACTION, BONUS…" style="width:100%;height:36px;background:var(--bg-deep);border:1px solid rgba(var(--border-tint),0.24);border-radius:8px;color:var(--text-main);font-size:12.5px;padding:0 8px;box-sizing:border-box"/>' +
          '</div>' +
          '<div style="display:flex;flex-direction:column;gap:4px;min-width:0">' +
            '<label style="font-size:10px;color:var(--text-muted)">Portée</label>' +
            '<input type="text" data-action="grimoire-spell-range" data-section-index="' + sIdx + '" data-spell-index="' + spIdx + '" value="' + escapeHtml(spell.range) + '" placeholder="9m · Conc. 1 min" style="width:100%;height:36px;background:var(--bg-deep);border:1px solid rgba(var(--border-tint),0.24);border-radius:8px;color:var(--text-main);font-size:12.5px;padding:0 8px;box-sizing:border-box"/>' +
          '</div>' +
        '</div>' +
        '<div style="display:flex;flex-direction:column;gap:4px">' +
          '<label style="font-size:10px;color:var(--text-muted)">Description</label>' +
          '<textarea data-action="grimoire-spell-desc" data-section-index="' + sIdx + '" data-spell-index="' + spIdx + '" placeholder="Effet du sort" style="width:100%;min-height:80px;background:var(--bg-deep);border:1px solid rgba(var(--border-tint),0.24);border-radius:8px;color:var(--text-main);font-size:13px;padding:8px 10px;box-sizing:border-box;font-family:inherit;line-height:1.4;resize:vertical">' + escapeHtml(spell.desc) + '</textarea>' +
        '</div>' +
        '<div style="display:flex;flex-direction:column;gap:4px">' +
          '<label style="font-size:10px;color:var(--text-muted)">Note d\'usage</label>' +
          '<textarea data-action="grimoire-spell-note" data-section-index="' + sIdx + '" data-spell-index="' + spIdx + '" placeholder="Conseil d\'utilisation" style="width:100%;min-height:52px;background:var(--bg-deep);border:1px solid rgba(var(--border-tint),0.24);border-radius:8px;color:var(--text-main);font-size:12.5px;padding:8px 10px;box-sizing:border-box;font-family:inherit;font-style:italic;line-height:1.4;resize:vertical">' + escapeHtml(spell.note) + '</textarea>' +
        '</div>' +
        '<div data-action="close-grimoire-spell-edit" style="flex:none;height:44px;border-radius:10px;background:var(--border-strong);border:1px solid rgba(var(--border-tint),0.34);color:var(--ink-bright);font-size:13px;font-weight:700;cursor:pointer;display:flex;align-items:center;justify-content:center" class="font-cinzel">Terminé</div>' +
      '</div>' +
    '</div>';
  }

  // Ligne de sort du Grimoire : tap sur la ligne pour ouvrir la popup de détail
  // (data-action="open-spell-detail"), plus une étoile de favori à gauche du nom. Le clic sur
  // l'étoile stoppe la propagation dans le handler 'toggle-favorite-spell' pour ne pas aussi
  // ouvrir la popup de détail (les deux éléments ont chacun leur propre data-action, donc chacun
  // son propre listener de clic).
  function renderGrimoireSection(section, spells) {
    var rowsHtml = spells.map(function (spell, i) {
      var favorited = profile().favoriteSpells.indexOf(spell.name) !== -1;
      return '<div data-action="open-spell-detail" data-name="' + escapeHtml(spell.name) + '" style="padding:11px 14px;background:' + (i % 2 ? 'var(--bg-card-alt)' : 'var(--bg-card)') + ';border-bottom:1px solid rgba(var(--border-tint),0.14);cursor:pointer">' +
        '<div style="display:flex;align-items:flex-start;justify-content:space-between;gap:10px">' +
          '<div style="display:flex;align-items:center;gap:6px;min-width:0">' +
            '<div data-action="toggle-favorite-spell" data-name="' + escapeHtml(spell.name) + '" style="flex:none;width:18px;height:18px;color:' + (favorited ? 'var(--text-gold)' : 'var(--text-dim)') + ';cursor:pointer;display:flex;align-items:center;justify-content:center">' + iconStar(favorited, 16) + '</div>' +
            '<div style="font-size:14px;font-weight:700;color:var(--text-main);font-family:\'Cinzel\',serif;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">' + escapeHtml(spell.name) + '</div>' +
          '</div>' +
          '<div style="flex:none;display:flex;flex-direction:column;align-items:flex-end;gap:3px">' +
            '<div style="display:flex;align-items:center;gap:5px">' +
              '<div style="background:rgba(var(--border-tint),0.12);border:1px solid rgba(var(--border-tint),0.32);color:var(--text-chip);padding:2px 6px;border-radius:6px;font-size:10px;font-weight:700;white-space:nowrap">' + escapeHtml(section.levelTag) + '</div>' +
              '<div style="' + spellBadgeStyle(spell.type) + 'padding:2px 8px;border-radius:6px;font-size:10px;font-weight:700;letter-spacing:0.03em;white-space:nowrap">' + escapeHtml(spell.type) + '</div>' +
            '</div>' +
            '<div style="font-size:10px;color:var(--text-muted);white-space:nowrap">' + escapeHtml(spell.range) + '</div>' +
          '</div>' +
        '</div>' +
        '<div style="font-size:12.5px;color:var(--text-desc);margin-top:6px;line-height:1.4">' + escapeHtml(spell.desc) + '</div>' +
        (spell.note ? '<div style="font-size:11px;color:var(--text-note);font-style:italic;margin-top:4px;line-height:1.3">' + escapeHtml(spell.note) + '</div>' : '') +
      '</div>';
    }).join('');

    return '<div style="display:flex;flex-direction:column;gap:6px">' +
      '<div style="font-size:11px;color:var(--text-label);text-transform:uppercase;letter-spacing:0.06em;font-weight:600">' + escapeHtml(section.title) + '</div>' +
      '<div style="display:flex;flex-direction:column;border-radius:12px;overflow:hidden;border:1px solid rgba(var(--border-tint),0.2)">' + rowsHtml + '</div>' +
    '</div>';
  }

  // Recherche pleine largeur (même pattern que #statsSearchInput), sélecteur de niveau à trois
  // zones ( - / "Niveau N" cliquable / + ) encadré par deux boutons "Tous" et "Favoris" (étoile),
  // et favoris par sort (étoile par ligne, persistée dans profile().favoriteSpells).
  // ui.grimoireTab est l'état du niveau sélectionné : il accepte en plus des niveaux réels
  // 'tous'/'favoris' (jamais renvoyés par grimoireTabs(), qui reste la seule source pour le cycle
  // -/+ et le menu déroulant : niveaux réels + 'classe').
  function renderGrimoire() {
    var levelTabs = grimoireTabs();
    var mode = ui.grimoireTab;
    if (levelTabs.indexOf(mode) === -1 && mode !== 'tous' && mode !== 'favoris') mode = ui.grimoireTab = levelTabs[0];

    var searchQuery = (ui.grimoireSearch || '').trim();
    var searching = searchQuery.length > 0;
    var searchLower = searchQuery.toLowerCase();
    function spellSearchRank(name) {
      var n = name.toLowerCase();
      if (n === searchLower) return 0;
      if (n.indexOf(searchLower) === 0) return 1;
      return 2;
    }

    // En recherche ou en mode "Tous"/"Favoris", toutes les sections sont parcourues (dans l'ordre
    // du grimoire, croissant puis "classe") plutôt que la seule section du niveau sélectionné.
    var allSections = activeSpellbook().sections;
    var relevantSections = (searching || mode === 'tous' || mode === 'favoris')
      ? allSections
      : allSections.filter(function (s) { return s.level === mode; });

    var baseCount = 0; // sorts visibles avant recherche, pour distinguer les messages "vide"
    var sectionsWithSpells = relevantSections.map(function (s) {
      var visible = s.spells;
      if (mode === 'favoris' && !searching) {
        visible = visible.filter(function (spell) { return profile().favoriteSpells.indexOf(spell.name) !== -1; });
      }
      baseCount += visible.length;
      var filtered = visible;
      if (searching) {
        filtered = filtered.filter(function (spell) { return spell.name.toLowerCase().indexOf(searchLower) !== -1; })
          .sort(function (a, b) { return spellSearchRank(a.name) - spellSearchRank(b.name); });
      }
      return { section: s, spells: filtered };
    }).filter(function (x) { return x.spells.length > 0; });

    var contentHtml;
    if (sectionsWithSpells.length) {
      contentHtml = sectionsWithSpells.map(function (x) { return renderGrimoireSection(x.section, x.spells); }).join('<div style="height:14px"></div>');
    } else if (searching) {
      contentHtml = '<div style="padding:24px 4px;text-align:center;font-size:12px;color:var(--text-dim)">Aucun sort ne correspond à « ' + escapeHtml(searchQuery) + ' ».</div>';
    } else if (mode === 'favoris' && baseCount === 0) {
      contentHtml = '<div style="padding:24px 4px;text-align:center;font-size:12px;color:var(--text-dim)">Aucun sort en favori. Appuyez sur l’étoile d’un sort pour l’ajouter.</div>';
    } else {
      contentHtml = '<div style="padding:24px 4px;text-align:center;font-size:12px;color:var(--text-dim)">Aucun sort à ce niveau.</div>';
    }

    // "Tous" et "Favoris" bornent la chaîne de navigation -/+ : Tous à gauche de tous les niveaux
    // (flèche droite → premier niveau, ex. 0 ou 1 selon si les sorts mineurs existent pour ce
    // personnage), Favoris à droite de tout (flèche gauche → dernier onglet, "Classe" en général).
    var fullChain = ['tous'].concat(levelTabs).concat(['favoris']);
    var curIdx = fullChain.indexOf(mode);
    var canPrev = curIdx > 0;
    var canNext = curIdx !== -1 && curIdx < fullChain.length - 1;
    function stepBtnStyle(enabled) {
      return enabled
        ? 'background:rgba(var(--border-tint),0.14);border:1px solid rgba(var(--border-tint),0.4);color:var(--text-label);cursor:pointer;'
        : 'background:rgba(var(--border-tint),0.06);border:1px solid rgba(var(--border-tint),0.15);color:var(--text-dim);cursor:default;pointer-events:none;';
    }

    var pillLabel = mode === 'tous' ? '-' : mode === 'favoris' ? 'Favoris' : (mode === 'classe' ? 'Classe' : 'Niv.' + mode);

    var dropdownHtml = '';
    if (ui.grimoireLevelMenuOpen) {
      var cellsHtml = levelTabs.map(function (t) {
        var active = t === mode;
        return '<div data-action="grimoire-tab" data-tab="' + t + '" style="' + (t === 'classe' ? 'grid-column:1/-1;' : '') + 'height:46px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:700;cursor:pointer;user-select:none;' +
          (active ? 'background:rgba(var(--border-tint),0.28);border:1px solid var(--border-strong);color:var(--text-gold);' : 'background:var(--bg-card-alt);border:1px solid rgba(var(--border-tint),0.2);color:var(--text-dim);') +
          '">' + escapeHtml(grimoireTabLabel(t)) + '</div>';
      }).join('');
      dropdownHtml = '<div style="margin-top:8px;display:grid;grid-template-columns:repeat(5,1fr);gap:8px;padding:14px;background:var(--bg-card);border:1px solid rgba(var(--border-tint),0.3);border-radius:12px">' + cellsHtml + '</div>';
    }

    return (
      '<div style="display:flex;flex-direction:column;height:100%;gap:10px;position:relative">' +
        '<input id="grimoireSearchInput" type="text" value="' + escapeHtml(ui.grimoireSearch || '') + '" placeholder="Rechercher" style="flex:none;height:48px;background:var(--bg-card);border:1px solid rgba(var(--border-tint),0.24);border-radius:10px;color:var(--text-main);font-size:15px;padding:0 16px;box-sizing:border-box"/>' +
        '<div id="grimoireChromeBlock" style="flex:none;display:flex;flex-direction:column;gap:10px">' +
          '<div style="display:flex;align-items:center;justify-content:space-between;gap:8px">' +
            '<div data-action="grimoire-tab" data-tab="tous" style="flex:none;height:58px;padding:0 19px;border-radius:13px;display:flex;align-items:center;justify-content:center;font-size:17px;font-weight:700;cursor:pointer;user-select:none;' +
              (mode === 'tous' ? 'background:rgba(var(--border-tint),0.28);border:1px solid var(--border-strong);color:var(--text-gold);' : 'background:rgba(var(--border-tint),0.14);border:1px solid rgba(var(--border-tint),0.4);color:var(--text-label);') +
              '">Tous</div>' +
            '<div style="flex:1;min-width:0;display:flex;align-items:center;justify-content:center;gap:8px">' +
              '<div data-action="grimoire-step" data-delta="-1" style="flex:none;width:58px;height:58px;border-radius:13px;display:flex;align-items:center;justify-content:center;user-select:none;' + stepBtnStyle(canPrev) + '">' + iconArrowLeft(27) + '</div>' +
              '<div data-action="toggle-grimoire-level-menu" style="flex:1;min-width:0;height:58px;padding:0 19px;border-radius:13px;background:var(--bg-card);border:1px solid rgba(var(--border-tint),0.3);color:var(--text-gold);display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;cursor:pointer;user-select:none;font-family:\'Cinzel\',serif;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">' + escapeHtml(pillLabel) + '</div>' +
              '<div data-action="grimoire-step" data-delta="1" style="flex:none;width:58px;height:58px;border-radius:13px;display:flex;align-items:center;justify-content:center;user-select:none;transform:scaleX(-1);' + stepBtnStyle(canNext) + '">' + iconArrowLeft(27) + '</div>' +
            '</div>' +
            '<div data-action="grimoire-tab" data-tab="favoris" style="flex:none;width:58px;height:58px;border-radius:13px;display:flex;align-items:center;justify-content:center;cursor:pointer;' +
              (mode === 'favoris' ? 'background:rgba(var(--border-tint),0.28);border:1px solid var(--border-strong);color:var(--text-gold);' : 'background:rgba(var(--border-tint),0.14);border:1px solid rgba(var(--border-tint),0.4);color:var(--text-label);') +
              '">' + iconStar(mode === 'favoris', 27) + '</div>' +
          '</div>' +
          dropdownHtml +
        '</div>' +
        '<div id="grimoireResetBtn" data-action="reset-grimoire-search" style="position:absolute;top:0;right:0;width:36px;height:36px;border-radius:8px;background:var(--bg-card);border:1px solid rgba(var(--border-tint),0.24);display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--text-main);opacity:0;pointer-events:none;transition:opacity 150ms ease-out;z-index:5">' + iconClose() + '</div>' +
        '<div id="grimoireSwipe" data-scroll-root style="flex:1;min-height:0;overflow-y:auto;display:flex;flex-direction:column;gap:14px;padding-bottom:4px">' + contentHtml + '</div>' +
      '</div>'
    );
  }

  function toggleTrackStyle(enabled) {
    return 'background:' + (enabled ? '#ef4444' : 'var(--border-strong)') + ';';
  }
  function toggleKnobStyle(enabled) {
    return 'left:' + (enabled ? '19px' : '3px') + ';';
  }

  function renderSettings() {
    var menuItems = [
      { view: 'settings-character', label: 'Paramétrer le personnage' },
      { view: 'settings-grimoire', label: 'Paramétrer le Grimoire' },
      { view: 'settings-load-character', label: 'Charger un personnage' },
      { view: 'settings-codex', label: 'Codex' }
    ];
    var itemsHtml = menuItems.map(function (item) {
      return '<div data-action="nav" data-view="' + item.view + '" style="display:flex;align-items:center;justify-content:space-between;gap:10px;padding:16px;background:var(--bg-card);border:1px solid rgba(var(--border-tint),0.2);border-radius:12px;cursor:pointer;color:var(--text-main)">' +
        '<div style="font-size:15px;font-weight:600">' + item.label + '</div>' +
        iconChevronRight() +
        '</div>';
    }).join('');

    var deployText = ui.githubDeployInfo.status === 'loaded' && ui.githubDeployInfo.date
      ? 'Dernière mise à jour : ' + formatDeployDate(ui.githubDeployInfo.date)
      : ui.githubDeployInfo.status === 'error'
        ? 'Dernière mise à jour : indisponible'

  // Tableau du Codex : une ligne compacte par PNJ (photo + nom sur la première ligne,
  // occupation puis faction/lieu en dessous) plutôt qu'un <table> à 6 colonnes qui scrollerait
  // horizontalement en plus du scroll vertical de la page — même arbitrage de geste imbriqué
  // qui posait déjà problème sur les rangées de badges du Tracker (voir CLAUDE.md), évité ici en
  // gardant tout sur un seul axe de scroll (vertical).
  // Recherche du Codex : même principe que celle des compétences (renderStats()) — filtre en
  // direct sur nom/prénom/fonction/lieu, classé par pertinence (correspondance exacte > début >
  // contient) sur le meilleur des quatre champs, champ de saisie exclu de la présélection globale
  // au focus (voir listener 'focusin') et focus préservé d'un re-render à l'autre (bindEvents()).
  function renderSettingsCodex() {
    var search = ui.codexSearch || '';
    var searchLower = search.toLowerCase();

    function fieldRank(value) {
      var v = (value || '').toLowerCase();
      if (v.indexOf(searchLower) === -1) return null;
      if (v === searchLower) return 0;
      if (v.indexOf(searchLower) === 0) return 1;
      return 2;
    }

    function codexMatchRank(n) {
      var ranks = [fieldRank(n.prenom), fieldRank(n.nom), fieldRank(n.occupation), fieldRank(n.lieu)]
        .filter(function (r) { return r !== null; });
      return ranks.length ? Math.min.apply(null, ranks) : null;
    }

    var filtered = CODEX_PNJ
      .map(function (n) { return { npc: n, rank: codexMatchRank(n) }; })
      .filter(function (x) { return x.rank !== null; })
      .sort(function (a, b) { return a.rank - b.rank; })
      .map(function (x) { return x.npc; });

    var rowsHtml = filtered.length
      ? filtered.map(function (n) {
          var fullName = n.nom ? (n.prenom + ' ' + n.nom) : n.prenom;
          var metaParts = [n.faction, n.lieu].filter(function (v) { return v; });
          return '<div data-action="open-codex-preview" data-codex-index="' + CODEX_PNJ.indexOf(n) + '" style="display:flex;align-items:center;gap:12px;padding:10px 4px;border-bottom:1px solid rgba(var(--border-tint),0.15);cursor:pointer">' +
            '<img src="' + escapeHtml(n.portrait) + '" alt="" style="flex:none;width:44px;height:44px;border-radius:50%;object-fit:cover;border:1px solid rgba(var(--border-tint),0.3)"/>' +
            '<div style="flex:1;min-width:0;display:flex;flex-direction:column;gap:2px">' +
