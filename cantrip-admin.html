<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cantrip - Admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-database-compat.js"></script>
<style>
  :root {
    --bg-gradient-1: #f6ecd2;
    --bg-gradient-2: #ecdcb0;
    --bg-deep: #e2cd9c;
    --bg-card: #f1e2bc;
    --bg-card-alt: #e8d7ab;
    --bg-nav: #e6d4a2;
    --border-strong: #8a6a3a;
    --border-tint: 122,90,42;
    --border-card: rgba(var(--border-tint), 0.2);
    --text-main: #3a2a15;
    --text-gold: #8a5a16;
    --text-label: #7a6440;
    --text-muted: #8f7850;
    --text-dim: #a89470;
    --text-desc: #5c4a2c;
    --text-note: #7a6440;
    --text-chip: #6b5430;
    --accent-red-text: #b91c1c;
    --accent-green-text: #157a3d;
    --accent-blue-text: #0a6ea8;
    --accent-purple-text: #6d28d9;
    --accent-gray-text: #55503f;
    --accent-gold-badge-text: #7c4a12;
    --bg-texture: rgba(90,60,20,0.035);
    --ink-bright: #efe4cf;
    --admin-bg: #cbb27a;
    --admin-panel: #d9c393;
  }
  * { box-sizing: border-box; }
  html, body { height:100%; margin:0; }
  body {
    font-family: -apple-system, 'SF Pro', system-ui, sans-serif;
    background: var(--admin-bg);
    color: var(--text-main);
    min-height:100vh;
    transition: background 0.2s;
  }
  .font-cinzel { font-family:'Cinzel', serif; }

  .btn{
    border:1px solid var(--border-strong);background:transparent;color:var(--text-gold);
    padding:9px 16px;border-radius:7px;cursor:pointer;font-size:13px;font-weight:600;font-family:inherit;
  }
  .btn:hover{background:var(--border-strong);color:var(--ink-bright);}
  .btn.primary{background:var(--border-strong);color:var(--ink-bright);}
  .btn.small{padding:5px 10px;font-size:11px;}
  .btn.danger{border-color:var(--accent-red-text);color:var(--accent-red-text);}
  .btn.danger:hover{background:var(--accent-red-text);color:#fff;}

  /* ---- écran de connexion (bloque tout accès au contenu tant que non autorisé) ---- */
  .auth-gate{
    display:flex;align-items:center;justify-content:center;min-height:100vh;padding:24px;
    background:
      linear-gradient(160deg, var(--bg-gradient-1) 0%, var(--bg-gradient-2) 100%),
      repeating-linear-gradient(45deg, var(--bg-texture) 0px, var(--bg-texture) 2px, transparent 2px, transparent 7px);
  }
  .gate-card{
    width:380px;max-width:100%;background:var(--bg-card);border:1px solid rgba(var(--border-tint),0.3);
    border-radius:16px;padding:28px 24px;text-align:center;box-shadow:0 12px 40px rgba(0,0,0,0.25);
  }
  .gate-title{font-size:20px;color:var(--text-gold);margin-bottom:12px;}
  .gate-card p{font-size:13px;color:var(--text-desc);line-height:1.5;margin:0 0 18px;}
  .gate-card .btn{width:100%;margin-bottom:8px;}
  .gate-error{margin-top:12px;font-size:12px;color:var(--accent-red-text);}
  .gate-hint{margin-top:12px;font-size:12px;color:var(--text-muted);}
  .gate-user{font-size:11px;color:var(--text-dim);word-break:break-all;margin-bottom:14px;}

  /* ---- chrome principal (identité visuelle proche de l'app : en-tête avec navigation intégrée,
     sélecteur de personnage compact, contenu en une colonne, barre d'action fixe) ---- */
  .app-root{display:flex;flex-direction:column;min-height:100vh;}
  .adm-header{
    display:flex;flex-direction:column;background:var(--admin-panel);
    border-bottom:1px solid rgba(var(--border-tint),0.3);position:sticky;top:0;z-index:20;
  }
  .adm-header-top{
    display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 20px 10px;
  }
  .adm-header-title{font-size:17px;color:var(--text-gold);letter-spacing:0.02em;}
  .adm-header-user{display:flex;align-items:center;gap:10px;font-size:11px;color:var(--text-dim);}
  .adm-header-user .email{max-width:160px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .adm-header-user .btn{padding:6px 10px;font-size:11px;}

  .adm-modebar{display:flex;}
  .adm-navbtn{
    flex:1;border:none;background:transparent;color:var(--text-dim);padding:11px 4px;font-size:12px;
    font-weight:700;cursor:pointer;font-family:inherit;border-bottom:2px solid transparent;
  }
  .adm-navbtn.active{color:var(--text-gold);border-bottom-color:var(--border-strong);}

  .adm-charswitch{
    display:flex;align-items:center;gap:10px;padding:12px 20px 0;max-width:640px;margin:0 auto;width:100%;box-sizing:border-box;
  }
  .charselect-label{flex:none;font-size:11px;color:var(--text-label);text-transform:uppercase;letter-spacing:0.06em;}
  .charselect{
    flex:1;height:40px;padding:0 12px;border-radius:9px;font-size:13px;font-weight:700;cursor:pointer;
    border:1px solid rgba(var(--border-tint),0.3);color:var(--text-main);background:var(--bg-card);font-family:inherit;
  }

  .adm-content{
    flex:1;max-width:640px;margin:0 auto;width:100%;box-sizing:border-box;padding:14px 16px 24px;
    display:flex;flex-direction:column;gap:14px;
  }
  .adm-toolbar{display:flex;gap:8px;flex-wrap:wrap;}
  .adm-toolbar .btn{flex:1;white-space:nowrap;}

  .panel-card{
    background:var(--bg-card-alt);border:1px solid rgba(var(--border-tint),0.2);border-radius:16px;
    padding:16px 14px;display:flex;flex-direction:column;gap:12px;position:relative;
  }

  .adm-actionbar{
    display:flex;gap:10px;padding:10px 16px;max-width:640px;margin:0 auto;width:100%;box-sizing:border-box;
    position:sticky;bottom:0;background:var(--admin-bg);z-index:15;
  }
  .adm-actionbar .btn{flex:1;}

  .adm-syncfooter{font-size:11px;color:var(--text-dim);display:flex;gap:6px 16px;flex-wrap:wrap;}
  .adm-syncfooter .refresh-link{cursor:pointer;text-decoration:underline;color:var(--text-muted);}

  details.adm-help{font-size:12.5px;color:var(--text-desc);}
  details.adm-help summary{cursor:pointer;font-size:12px;font-weight:600;color:var(--text-label);text-transform:uppercase;letter-spacing:0.05em;}
  details.adm-help p{line-height:1.5;margin:8px 0 0;}
  details.adm-help code{background:rgba(var(--border-tint),0.12);padding:1px 4px;border-radius:4px;}

  .phone{
    display:flex;flex-direction:column;gap:12px;position:relative;
  }
  .grim-header{display:flex;align-items:center;justify-content:space-between;gap:8px;}
  .grim-title{font-size:21px;font-weight:700;letter-spacing:0.3px;color:var(--text-main);}
  .filter-chips{display:flex;gap:6px;}
  .chip{
    height:26px;padding:0 10px;border-radius:13px;display:flex;align-items:center;justify-content:center;
    font-size:10px;font-weight:700;letter-spacing:0.02em;cursor:pointer;user-select:none;
    background:transparent;border:1px solid rgba(var(--border-tint),0.25);color:var(--text-dim);
  }
  .chip.active-action{background:rgba(125,211,252,0.16);border:1px solid rgba(125,211,252,0.45);color:var(--accent-blue-text);}
  .chip.active-bonus{background:rgba(34,197,94,0.16);border:1px solid rgba(34,197,94,0.45);color:var(--accent-green-text);}
  .chip.active-reaction{background:rgba(239,68,68,0.16);border:1px solid rgba(239,68,68,0.45);color:var(--accent-red-text);}

  .hscroll{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none;}
  .hscroll::-webkit-scrollbar{display:none;}
  .tab{
    position:relative;flex:none;min-width:38px;height:32px;padding:0 12px;border-radius:16px;
    display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;cursor:pointer;user-select:none;
    background:transparent;border:1px solid rgba(var(--border-tint),0.2);color:var(--text-dim);
  }
  .tab.active{background:rgba(var(--border-tint),0.28);border:1px solid var(--border-strong);color:var(--text-gold);}
  .tab-add{background:transparent;border:1px dashed rgba(var(--border-tint),0.4);color:var(--text-dim);}

  .spell-scroll{flex:1;min-height:0;overflow-y:auto;display:flex;flex-direction:column;gap:14px;padding-bottom:70px;}
  .section-block{display:flex;flex-direction:column;gap:6px;}
  .section-title{font-size:11px;color:var(--text-label);text-transform:uppercase;letter-spacing:0.06em;font-weight:600;display:flex;justify-content:space-between;align-items:center;}
  .section-title .del-section{font-size:10px;color:var(--accent-red-text);cursor:pointer;text-transform:none;letter-spacing:0;opacity:0.75;}
  .section-cards{display:flex;flex-direction:column;border-radius:12px;overflow:hidden;border:1px solid rgba(var(--border-tint),0.2);}
  .spell-row{padding:11px 14px;border-bottom:1px solid rgba(var(--border-tint),0.14);cursor:pointer;position:relative;}
  .spell-row:hover{filter:brightness(0.96);}
  .spell-row-head{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;}
  .spell-name{font-size:14px;font-weight:700;color:var(--text-main);font-family:'Cinzel',serif;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .spell-meta{flex:none;display:flex;flex-direction:column;align-items:flex-end;gap:3px;}
  .badge-row{display:flex;align-items:center;gap:5px;}
  .lvl-badge{background:rgba(var(--border-tint),0.12);border:1px solid rgba(var(--border-tint),0.32);color:var(--text-chip);padding:2px 6px;border-radius:6px;font-size:10px;font-weight:700;white-space:nowrap;}
  .type-badge{padding:2px 8px;border-radius:6px;font-size:10px;font-weight:700;letter-spacing:0.03em;white-space:nowrap;}
  .spell-range{font-size:10px;color:var(--text-muted);white-space:nowrap;}
  .spell-desc{font-size:12.5px;color:var(--text-desc);margin-top:6px;line-height:1.4;}
  .spell-note{font-size:11px;color:var(--text-note);font-style:italic;margin-top:4px;line-height:1.3;}
  .always-tag{display:inline-block;margin-top:4px;font-size:9.5px;font-weight:700;text-transform:uppercase;letter-spacing:0.04em;color:var(--accent-green-text);}

  .fab{
    position:absolute;right:20px;bottom:20px;width:52px;height:52px;border-radius:26px;
    background:var(--border-strong);color:var(--ink-bright);display:flex;align-items:center;justify-content:center;
    cursor:pointer;box-shadow:0 4px 16px rgba(0,0,0,0.35);font-size:26px;font-weight:400;border:none;
  }

  .toggle-track{width:40px;height:24px;border-radius:12px;position:relative;cursor:pointer;flex:none;transition:background 150ms;}
  .toggle-knob{width:18px;height:18px;border-radius:9px;background:var(--ink-bright);position:absolute;top:3px;transition:left 150ms;}

  .person-panel{
    display:flex;flex-direction:column;gap:16px;
  }
  .person-panel .psec{display:flex;flex-direction:column;gap:6px;flex:none;}
  .person-panel .psec-label{font-size:11px;color:var(--text-label);text-transform:uppercase;letter-spacing:0.06em;}
  .person-panel .pcard{display:flex;flex-direction:column;border-radius:12px;overflow:hidden;border:1px solid rgba(var(--border-tint),0.2);}
  .person-panel .prow{display:flex;align-items:center;gap:8px;padding:9px 12px;background:var(--bg-card);border-bottom:1px solid rgba(var(--border-tint),0.14);}
  .person-panel .pgrid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;padding:12px;background:var(--bg-card);border-radius:12px;border:1px solid rgba(var(--border-tint),0.2);}
  .person-panel .pfield{display:flex;flex-direction:column;gap:4px;min-width:0;}
  .person-panel .pfield label{font-size:11px;color:var(--text-muted);text-align:center;}
  .person-panel input[type=text].pnum, .person-panel input[type=text].psigned{width:100%;height:44px;background:var(--bg-deep);border:1px solid rgba(var(--border-tint),0.24);border-radius:8px;color:var(--text-main);font-size:15px;text-align:center;box-sizing:border-box;font-family:inherit;}
  .panel-card .padd{height:44px;border-radius:10px;background:var(--bg-card);border:1px dashed rgba(var(--border-tint),0.4);color:var(--text-label);font-size:13px;font-weight:600;cursor:pointer;display:flex;align-items:center;justify-content:center;text-align:center;}
  .person-panel .premove{flex:none;width:36px;height:36px;border-radius:8px;background:rgba(239,68,68,0.15);border:1px solid rgba(239,68,68,0.4);color:#ef4444;font-size:16px;font-weight:700;display:flex;align-items:center;justify-content:center;cursor:pointer;user-select:none;}
  .person-panel .preorder{flex:none;display:flex;flex-direction:column;gap:2px;}
  .person-panel .preorder div{width:22px;height:17px;background:var(--bg-deep);border:1px solid rgba(var(--border-tint),0.3);color:var(--text-muted);font-size:9px;display:flex;align-items:center;justify-content:center;cursor:pointer;user-select:none;}
  .person-title{font-size:21px;font-weight:700;letter-spacing:0.3px;color:var(--text-main);}

  .empty-hint{padding:24px 4px;text-align:center;font-size:12px;color:var(--text-dim);}

  .modal-backdrop{display:none;position:fixed;inset:0;background:rgba(10,8,6,0.65);align-items:center;justify-content:center;padding:20px;z-index:60;}
  .modal-backdrop.open{display:flex;}
  .modal{background:var(--admin-panel);border:1px solid var(--border-strong);border-radius:12px;max-width:520px;width:100%;max-height:88vh;overflow-y:auto;padding:24px;color:var(--text-main);}
  .modal h3{font-family:'Cinzel',serif;color:var(--text-gold);margin-top:0;font-size:18px;}
  .field{margin-bottom:13px;}
  .field label{display:block;font-size:11px;text-transform:uppercase;letter-spacing:0.05em;color:var(--text-label);margin-bottom:5px;font-weight:600;}
  .field input[type=text], .field input[type=number], .field select, .field textarea{
    width:100%;background:rgba(255,255,255,0.5);border:1px solid rgba(var(--border-tint),0.3);color:var(--text-main);
    padding:9px 11px;border-radius:6px;font-size:14px;font-family:inherit;
  }
  .field textarea{resize:vertical;min-height:70px;}
  .field-row{display:flex;gap:10px;}
  .field-row .field{flex:1;}
  .check-row{display:flex;align-items:center;gap:8px;font-size:13px;}
  .modal-actions{display:flex;justify-content:space-between;gap:10px;margin-top:18px;border-top:1px solid rgba(var(--border-tint),0.25);padding-top:16px;}
  .modal-actions .right{display:flex;gap:8px;}

  .toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--border-strong);color:var(--ink-bright);padding:10px 20px;border-radius:6px;font-size:13px;opacity:0;pointer-events:none;transition:opacity 0.25s;z-index:100;}
  .toast.show{opacity:1;}

  @media (max-width: 640px) {
    .adm-header-top{padding:10px 14px 8px;}
    .adm-header-title{font-size:15px;}
    .adm-charswitch{padding:10px 14px 0;}
    .adm-content{padding:12px 12px 20px;}
    .adm-actionbar{padding:8px 12px;}
    .btn{padding:11px 14px;min-height:40px;}
    .modal{padding:16px;}
    .field-row{flex-wrap:wrap;}
    .field-row .field{flex:1 1 140px;}
  }
</style>
</head>
<body>
<div class="auth-gate" id="authGate"></div>

<div class="app-root" id="appRoot" style="display:none;">
  <header class="adm-header">
    <div class="adm-header-top">
      <div class="adm-header-title font-cinzel">Cantrip · Admin</div>
      <div class="adm-header-user" id="admHeaderUser"></div>
    </div>
    <nav class="adm-modebar">
      <button class="adm-navbtn" id="btnModePersonnage" data-mode="personnage">Personnages</button>
      <button class="adm-navbtn" id="btnModeGrimoire" data-mode="grimoire">Grimoires</button>
      <button class="adm-navbtn" id="btnModeAcces" data-mode="acces">Accès</button>
    </nav>
  </header>

  <div class="adm-charswitch" id="charSwitch"></div>

  <main class="adm-content">
    <div class="adm-toolbar" id="panelToolbar"></div>

    <div class="panel-card phone" id="phone" style="display:none;">
      <div class="grim-header">
        <div class="grim-title font-cinzel">Grimoire</div>
        <div class="filter-chips" id="filterChips"></div>
      </div>
      <div class="hscroll" id="levelTabs"></div>
      <div class="spell-scroll" id="spellScroll"></div>
      <div class="padd" id="fabAdd">+ Ajouter un sort</div>
    </div>

    <div class="panel-card person-panel" id="personPanel" style="display:none;"></div>
    <div class="panel-card person-panel" id="accessPanel" style="display:none;"></div>

    <div class="adm-syncfooter" id="syncFooter"></div>
  </main>

  <div class="adm-actionbar" id="actionBar">
    <button class="btn" id="btnFbLoad">Charger</button>
    <button class="btn primary" id="btnFbSave">Sauvegarder</button>
  </div>
</div>

<!-- Modal: add/edit spell -->
<div class="modal-backdrop" id="spellModalBackdrop">
  <div class="modal">
    <h3 id="spellModalTitle">Ajouter un sort</h3>
    <form id="spellForm">
      <input type="hidden" id="sp_index">
      <div class="field">
        <label>Nom du sort</label>
        <input type="text" id="sp_name" required>
      </div>
      <div class="field-row">
        <div class="field">
          <label>Type</label>
          <input type="text" id="sp_type" list="typeOptions" placeholder="ACTION" required>
          <datalist id="typeOptions">
            <option value="ACTION"></option>
            <option value="BONUS"></option>
            <option value="RÉACTION"></option>
            <option value="RITUEL"></option>
            <option value="RITUEL 1 MIN"></option>
            <option value="PASSIF"></option>
            <option value="10 MIN"></option>
            <option value="REPOS COURT"></option>
            <option value="SERMENT"></option>
          </datalist>
        </div>
        <div class="field">
          <label>Portee / duree</label>
          <input type="text" id="sp_range" placeholder="18m . Conc. 1 min" required>
        </div>
      </div>
      <div class="field" id="alwaysAvailableField" style="display:none;">
        <div class="check-row">
          <input type="checkbox" id="sp_always">
          <label style="margin:0;text-transform:none;font-weight:400;" for="sp_always">Toujours disponible (sort de serment, non soumis a preparation)</label>
        </div>
      </div>
      <div class="field">
        <label>Description</label>
        <textarea id="sp_desc" required></textarea>
      </div>
      <div class="field">
        <label>Note tactique (optionnel)</label>
        <textarea id="sp_note"></textarea>
      </div>
      <div class="modal-actions">
        <button type="button" class="btn danger" id="btnDeleteSpell" style="display:none;">Supprimer</button>
        <div class="right">
          <button type="button" class="btn" id="btnCancelSpell">Annuler</button>
          <button type="submit" class="btn primary">Enregistrer</button>
        </div>
      </div>
    </form>
  </div>
</div>

<!-- Modal: manage levels -->
<div class="modal-backdrop" id="levelModalBackdrop">
  <div class="modal">
    <h3>Gerer les niveaux</h3>
    <div id="levelList" style="display:flex;flex-direction:column;gap:8px;margin-bottom:18px;"></div>
    <div style="border-top:1px solid rgba(var(--border-tint),0.25);padding-top:16px;">
      <div class="field-row">
        <div class="field">
          <label>Niveau</label>
          <select id="lv_level">
            <option value="0">0 (tour de magie)</option>
            <option value="1">1</option><option value="2">2</option><option value="3">3</option>
            <option value="4">4</option><option value="5">5</option><option value="6">6</option>
            <option value="7">7</option><option value="8">8</option><option value="9">9</option>
            <option value="classe">Capacites de classe</option>
          </select>
        </div>
        <div class="field">
          <label>Titre de section</label>
          <input type="text" id="lv_title" placeholder="Niveau 5">
        </div>
        <div class="field">
          <label>Etiquette</label>
          <input type="text" id="lv_tag" placeholder="Niv. 5">
        </div>
      </div>
      <button class="btn primary" id="btnAddLevelConfirm" style="width:100%;">Ajouter ce niveau</button>
    </div>
    <div class="modal-actions">
      <div></div>
      <div class="right"><button type="button" class="btn" id="btnCloseLevelModal">Fermer</button></div>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
var STORAGE_KEY = 'cantrip_admin_grimoire_v1';

// ---- seed data (copie exacte des grimoires actuels de Cantrip) ----
  var SEED_CALIX = {
    sections: [
      {
        title: "Sorts mineurs (niveau 0)",
        levelTag: "Niv. 0",
        level: 0,
        spells: [
          { name: "Moquerie cruelle", type: "ACTION", range: "18m", desc: "Jet de sauvegarde de Sagesse ou 1d4 dégâts psychiques + désavantage au prochain jet d'attaque de la cible.", note: "Fonctionne si la cible entend (sans comprendre). 2d4 au niveau 5, 3d4 au niveau 11." },

// Comble/valide un profil (venant d'un import JSON ou d'une ancienne sauvegarde locale de
// l'outil) sans dépendre de l'app : version allégée de sanitizeProfile() dans index.html (pas de
// used[]/current, dérivés à l'export uniquement).
function sanitizeAdminProfile(p) {
  if (!p || typeof p !== 'object') p = {};
  if (!p.hp || typeof p.hp !== 'object') p.hp = { current: 10, max: 10, temp: 0 };
  if (typeof p.hp.max !== 'number' || isNaN(p.hp.max)) p.hp.max = 10;
  p.hp.max = clamp(p.hp.max, 0, 999);
  if (typeof p.hp.current !== 'number' || isNaN(p.hp.current)) p.hp.current = p.hp.max;
  p.hp.current = clamp(p.hp.current, 0, p.hp.max);
  if (typeof p.hp.temp !== 'number' || isNaN(p.hp.temp)) p.hp.temp = 0;
  p.hp.temp = clamp(p.hp.temp, 0, 999);
  if (!p.combatStats || typeof p.combatStats !== 'object') p.combatStats = { ac: 10, initiative: 0, speed: 9, spellSaveDc: 10, spellAttackBonus: 0, hitDice: '' };
  if (typeof p.combatStats.ac !== 'number' || isNaN(p.combatStats.ac)) p.combatStats.ac = 10;
  if (typeof p.combatStats.initiative !== 'number' || isNaN(p.combatStats.initiative)) p.combatStats.initiative = 0;
  if (typeof p.combatStats.speed !== 'number' || isNaN(p.combatStats.speed)) p.combatStats.speed = 9;
  if (typeof p.combatStats.spellSaveDc !== 'number' || isNaN(p.combatStats.spellSaveDc)) p.combatStats.spellSaveDc = 10;
  if (typeof p.combatStats.spellAttackBonus !== 'number' || isNaN(p.combatStats.spellAttackBonus)) p.combatStats.spellAttackBonus = 0;
  if (typeof p.combatStats.hitDice !== 'string') p.combatStats.hitDice = '';
  if (typeof p.concentration !== 'boolean') p.concentration = false;
  if (typeof p.inspiration !== 'boolean') p.inspiration = false;
  if (!Array.isArray(p.attacks)) p.attacks = [];
  p.attacks.forEach(function (atk) {
    if (typeof atk.id !== 'string' || !atk.id) atk.id = generateAdminId();
    if (typeof atk.name !== 'string') atk.name = 'Arme';
    if (typeof atk.melee !== 'boolean') atk.melee = true;
    if (typeof atk.rangeMeters !== 'number' || isNaN(atk.rangeMeters)) atk.rangeMeters = 0;
    atk.rangeMeters = clamp(Math.round(atk.rangeMeters), 0, 999);
    if (typeof atk.attackBonus !== 'number' || isNaN(atk.attackBonus)) atk.attackBonus = 0;
    atk.attackBonus = clamp(Math.round(atk.attackBonus), -99, 99);
    if (typeof atk.damageDice !== 'string') atk.damageDice = '';
    if (typeof atk.damageBonus !== 'number' || isNaN(atk.damageBonus)) atk.damageBonus = 0;
    atk.damageBonus = clamp(Math.round(atk.damageBonus), -99, 99);
    if (typeof atk.damageType !== 'string') atk.damageType = '';
  });
  if (!Array.isArray(p.spellLevels) || p.spellLevels.length !== 9) p.spellLevels = defaultSpellLevelsAdmin();
  else p.spellLevels.forEach(function (l, i) {
    if (typeof l.level !== 'number') l.level = i + 1;
    if (typeof l.enabled !== 'boolean') l.enabled = false;
    if (typeof l.max !== 'number' || isNaN(l.max)) l.max = 0;
    l.max = clamp(l.max, 0, 12);
  });
  if (!Array.isArray(p.classResources)) p.classResources = [];
  p.classResources.forEach(function (cr) {
    if (typeof cr.id !== 'string' || !cr.id) cr.id = generateAdminId();
    if (typeof cr.label !== 'string') cr.label = 'Ressource de Classe';
    if (typeof cr.max !== 'number' || isNaN(cr.max)) cr.max = 0;
    if (cr.type !== 'counter') cr.type = 'badges';
    cr.max = clamp(cr.max, 0, cr.type === 'counter' ? 99 : 20);
  });
  if (!p.abilityScores || typeof p.abilityScores !== 'object') p.abilityScores = defaultAbilityMapAdmin();
  ABILITY_KEYS.forEach(function (k) { if (typeof p.abilityScores[k] !== 'number' || isNaN(p.abilityScores[k])) p.abilityScores[k] = 0; });
  if (!p.savingThrows || typeof p.savingThrows !== 'object') p.savingThrows = defaultAbilityMapAdmin();
  ABILITY_KEYS.forEach(function (k) { if (typeof p.savingThrows[k] !== 'number' || isNaN(p.savingThrows[k])) p.savingThrows[k] = 0; });
  if (!Array.isArray(p.skills) || p.skills.length !== SKILL_NAMES.length) p.skills = defaultSkillsAdmin();
  else p.skills.forEach(function (s, i) {
    s.name = SKILL_NAMES[i];
    if (typeof s.modifier !== 'number' || isNaN(s.modifier)) s.modifier = 0;
    s.modifier = clamp(s.modifier, -99, 99);
  });
  if (!Array.isArray(p.preparedSpells)) p.preparedSpells = [];
  else p.preparedSpells = p.preparedSpells.filter(function (n) { return typeof n === 'string'; });
  if (typeof p.gold !== 'number' || isNaN(p.gold)) p.gold = 0;
  p.gold = clamp(Math.round(p.gold), 0, 10000);
  return p;
}

var ui = {
  mode: 'grimoire', // 'grimoire' | 'personnage' | 'acces'
  activeChar: 'calix', // 'calix' | 'deneor'
  activeLevel: null,
  filters: { action: false, bonus: false, reaction: false },
  levelError: '', // message d'erreur d'activation d'un emplacement de sorts (mode Personnage)
  accessRequests: null, // null (jamais chargé) | tableau [{ uid, email, name, requestedAt }]
  approvedUsers: null, // null (jamais chargé) | tableau [{ uid, email, name }]
  accessCharacters: null, // null (jamais chargé) | tableau [{ charId, name, ownerUid, accessUids }]
  accessBusy: false,
  accessError: null
};

function cloneSeed() {
  return {
    calix: JSON.parse(JSON.stringify(SEED_CALIX)).sections,
    deneor: JSON.parse(JSON.stringify(SEED_DENEOR)).sections,
    profiles: cloneSeedProfiles()
  };
}

var state;
function loadState() {
  try {
    var raw = localStorage.getItem(STORAGE_KEY);
    if (raw) {
      var parsed = JSON.parse(raw);
      if (!parsed.profiles || typeof parsed.profiles !== 'object') {
        parsed.profiles = cloneSeedProfiles();
      } else {
        ['calix', 'deneor'].forEach(function (c) {
          if (!parsed.profiles[c] || typeof parsed.profiles[c] !== 'object') parsed.profiles[c] = cloneSeedProfiles()[c];
          else sanitizeAdminProfile(parsed.profiles[c]);
        });
      }
      return parsed;
    }
  } catch (e) {}
  return cloneSeed();
}
function saveState() {
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); } catch (e) { showToast('Erreur de sauvegarde locale', true); }
}

function activeSections() { return state[ui.activeChar]; }
function personProfile() { return state.profiles[ui.activeChar]; }

function levelOrder(sections) {
  var nums = sections.filter(function (s) { return s.level !== 'classe'; }).map(function (s) { return s.level; }).sort(function (a, b) { return a - b; });
  var out = nums.slice();
  if (sections.some(function (s) { return s.level === 'classe'; })) out.push('classe');
  return out;
}

function sectionByLevel(level) {
  return activeSections().filter(function (s) { return s.level === level; })[0];
}

// ---- rendu identique a l'app (badges, filtres) ----
function spellBadgeStyle(type) {
  var t = type.toUpperCase();
  if (t.indexOf('BONUS') === 0) return 'background:rgba(34,197,94,0.16);border:1px solid rgba(34,197,94,0.45);color:var(--accent-green-text);';
  if (t.indexOf('RÉACTION') === 0) return 'background:rgba(239,68,68,0.16);border:1px solid rgba(239,68,68,0.45);color:var(--accent-red-text);';
  if (t.indexOf('RITUEL') === 0) return 'background:rgba(167,139,250,0.16);border:1px solid rgba(167,139,250,0.45);color:var(--accent-purple-text);';
  if (t.indexOf('PASSIF') === 0) return 'background:rgba(148,163,184,0.16);border:1px solid rgba(148,163,184,0.45);color:var(--accent-gray-text);';
  if (t.indexOf('ACTION') === 0) return 'background:rgba(125,211,252,0.16);border:1px solid rgba(125,211,252,0.45);color:var(--accent-blue-text);';
  return 'background:rgba(var(--border-tint),0.16);border:1px solid rgba(var(--border-tint),0.45);color:var(--accent-gold-badge-text);';
}

var GRIMOIRE_FILTERS = [
  { key: 'action', label: 'Action', prefix: 'ACTION', cls: 'active-action' },
  { key: 'bonus', label: 'Bonus', prefix: 'BONUS', cls: 'active-bonus' },
  { key: 'reaction', label: 'Réaction', prefix: 'RÉACTION', cls: 'active-reaction' }
];

function spellMatchesFilters(spell) {
  var active = GRIMOIRE_FILTERS.filter(function (f) { return ui.filters[f.key]; });
  if (!active.length) return true;
  var t = spell.type.toUpperCase();
  return active.some(function (f) { return t.indexOf(f.prefix) === 0; });
}

function escapeHtml(s) {
  return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}

function levelTabLabel(level) { return level === 'classe' ? 'Classe' : String(level); }

// ---- render ----
function render() {
  // Thème toujours neutre (Calix) dans l'outil admin, quel que soit le personnage édité — évite
  // de brouiller la lecture des formulaires avec le thème sombre de Deneor.

  // sélecteur de personnage : liste déroulante plutôt qu'une rangée de chips (qui s'encombrerait
  // avec plus de deux personnages) ; même sélecteur, identique en mode Personnages et Grimoires,
  // masqué en mode Accès qui gère déjà tous les personnages dans son propre tableau.
  var sw = document.getElementById('charSwitch');
  sw.style.display = ui.mode === 'acces' ? 'none' : 'flex';
  if (ui.mode !== 'acces') {
    sw.innerHTML = '<label class="charselect-label" for="charSelect">Personnage</label>' +
      '<select id="charSelect" class="charselect">' +
      ['calix', 'deneor'].map(function (c) {
        return '<option value="' + c + '"' + (ui.activeChar === c ? ' selected' : '') + '>' + escapeHtml(CHARACTER_NAMES[c]) + '</option>';
      }).join('') +
      '</select>';
    document.getElementById('charSelect').addEventListener('change', function () {
      ui.activeChar = this.value; ui.activeLevel = null; render();
    });
  }

  // onglets de navigation (Personnages / Grimoires / Accès — Accès réservé à l'admin)
  var btnPerso = document.getElementById('btnModePersonnage');
  var btnGrim = document.getElementById('btnModeGrimoire');
  var btnAcces = document.getElementById('btnModeAcces');
  btnAcces.style.display = authState.isAdmin ? '' : 'none';
  if (!authState.isAdmin && ui.mode === 'acces') ui.mode = 'grimoire';
  btnPerso.className = 'adm-navbtn' + (ui.mode === 'personnage' ? ' active' : '');
  btnGrim.className = 'adm-navbtn' + (ui.mode === 'grimoire' ? ' active' : '');
  btnAcces.className = 'adm-navbtn' + (ui.mode === 'acces' ? ' active' : '');
  btnPerso.onclick = function () { ui.mode = 'personnage'; render(); };
  btnGrim.onclick = function () { ui.mode = 'grimoire'; render(); };
  btnAcces.onclick = function () { ui.mode = 'acces'; render(); };

  document.getElementById('btnFbLoad').onclick = fbLoadPersonnage;
  document.getElementById('btnFbSave').onclick = fbSavePersonnage;
  document.getElementById('actionBar').style.display = ui.mode === 'acces' ? 'none' : 'flex';

  document.getElementById('phone').style.display = ui.mode === 'grimoire' ? 'flex' : 'none';
  document.getElementById('personPanel').style.display = ui.mode === 'personnage' ? 'flex' : 'none';
  document.getElementById('accessPanel').style.display = ui.mode === 'acces' ? 'flex' : 'none';
  renderPanelToolbar();

  if (ui.mode === 'personnage') { renderPersonnage(); return; }
  if (ui.mode === 'acces') { renderAccess(); return; }

  var sections = activeSections();
  var order = levelOrder(sections);
  if (ui.activeLevel === null || order.indexOf(ui.activeLevel) === -1) ui.activeLevel = order.length ? order[0] : null;

  // filter chips
  var fc = document.getElementById('filterChips');
  fc.innerHTML = GRIMOIRE_FILTERS.map(function (f) {
    var active = !!ui.filters[f.key];
    return '<div class="chip ' + (active ? f.cls : '') + '" data-filter="' + f.key + '">' + f.label + '</div>';
  }).join('');
  fc.querySelectorAll('.chip').forEach(function (el) {
    el.addEventListener('click', function () { ui.filters[el.dataset.filter] = !ui.filters[el.dataset.filter]; render(); });
  });

  // level tabs
  var lt = document.getElementById('levelTabs');
  lt.innerHTML = order.map(function (lvl) {
    return '<div class="tab ' + (lvl === ui.activeLevel ? 'active' : '') + '" data-level="' + lvl + '">' + levelTabLabel(lvl) + '</div>';
  }).join('') + '<div class="tab tab-add" id="tabAddLevel">+</div>';
  lt.querySelectorAll('.tab[data-level]').forEach(function (el) {
    el.addEventListener('click', function () {
      var v = el.dataset.level;
      ui.activeLevel = (v === 'classe') ? 'classe' : parseInt(v, 10);
      render();
    });
  });
  var tabAdd = document.getElementById('tabAddLevel');
  if (tabAdd) tabAdd.addEventListener('click', openLevelModal);

  // spell list
  var scroll = document.getElementById('spellScroll');
  var section = ui.activeLevel === null ? null : sectionByLevel(ui.activeLevel);
  if (!section) {
    scroll.innerHTML = '<div class="empty-hint">Aucun niveau. Utilisez "Gerer les niveaux" pour en creer un.</div>';
  } else {
    var visibleSpells = section.spells.filter(spellMatchesFilters);
    var rowsHtml = visibleSpells.map(function (spell) {
      var realIndex = section.spells.indexOf(spell);
      return '<div class="spell-row" data-index="' + realIndex + '">' +
        '<div class="spell-row-head">' +
          '<div class="spell-name">' + escapeHtml(spell.name) + '</div>' +
          '<div class="spell-meta">' +
            '<div class="badge-row">' +
              '<div class="lvl-badge">' + escapeHtml(section.levelTag) + '</div>' +
              '<div class="type-badge" style="' + spellBadgeStyle(spell.type) + '">' + escapeHtml(spell.type) + '</div>' +
            '</div>' +
            '<div class="spell-range">' + escapeHtml(spell.range) + '</div>' +
          '</div>' +
        '</div>' +
        '<div class="spell-desc">' + escapeHtml(spell.desc) + '</div>' +
        (spell.note ? '<div class="spell-note">' + escapeHtml(spell.note) + '</div>' : '') +
        (spell.alwaysAvailable ? '<div class="always-tag">Toujours disponible</div>' : '') +
      '</div>';
    }).join('');

    scroll.innerHTML = '<div class="section-block">' +
      '<div class="section-title"><span>' + escapeHtml(section.title) + '</span><span class="del-section" id="delSectionBtn">supprimer ce niveau</span></div>' +
      '<div class="section-cards">' + (rowsHtml || '<div class="empty-hint">Aucun sort. Utilisez le bouton + pour en ajouter.</div>') + '</div>' +
    '</div>';

    scroll.querySelectorAll('.spell-row').forEach(function (el) {
      el.addEventListener('click', function () { openSpellModal(parseInt(el.dataset.index, 10)); });
    });
    var delBtn = document.getElementById('delSectionBtn');
    if (delBtn) delBtn.addEventListener('click', function (e) { e.stopPropagation(); deleteCurrentSection(); });
  }

  var alwaysField = document.getElementById('alwaysAvailableField');
  alwaysField.style.display = (ui.activeChar === 'deneor' && ui.activeLevel !== 'classe') ? 'block' : 'none';
}

// ---- personnage (mode Personnage) ----

function pToggleKnobStyle(on) { return 'left:' + (on ? '19px' : '3px') + ';'; }

    '<input type="text" class="pnum" data-action="' + action + '" data-key="' + key + '" value="' + escapeHtml(value) + '" placeholder="' + escapeHtml(placeholder || '') + '"/></div>';

  var levelRows = p.spellLevels.map(function (l, idx) {
    var lowerEnabled = p.spellLevels.slice(0, idx).every(function (x) { return x.enabled; });
    var levelLocked = !l.enabled && !lowerEnabled;
    return '<div class="prow" style="' + (levelLocked ? 'opacity:0.45;' : '') + '">' +
      '<div style="width:56px;font-size:13px;font-weight:600;color:var(--text-main);">Niv. ' + l.level + '</div>' +
      '<div class="toggle-track" style="' + pToggleTrackStyle(l.enabled) + '" data-action="p-level-toggle" data-level="' + l.level + '"><div class="toggle-knob" style="' + pToggleKnobStyle(l.enabled) + '"></div></div>' +
      '<div style="flex:1;"></div>' +
      '<label style="font-size:11px;color:var(--text-muted);">Max</label>' +
      '<input type="text" inputmode="numeric" pattern="[0-9]*" class="pnum" style="width:42px;height:34px;" value="' + l.max + '" data-action="p-level-max" data-level="' + l.level + '" ' + (l.enabled ? '' : 'disabled') + '/>' +
    '</div>';
  }).join('');
  var spellLevelsHtml = '<div class="psec"><div class="psec-label">Emplacements de sorts</div><div class="pcard">' + levelRows + '</div>' +
    (ui.levelError ? '<div style="font-size:11px;color:#ef4444;">' + escapeHtml(ui.levelError) + '</div>' : '') + '</div>';

  var crRows = p.classResources.map(function (cr, idx) {
    return '<div class="prow">' +
      '<div class="preorder">' +
        '<div data-action="p-cr-up" data-id="' + cr.id + '" style="border-radius:5px 5px 0 0;' + (idx === 0 ? 'opacity:0.3;pointer-events:none;' : '') + '">&#9650;</div>' +
        '<div data-action="p-cr-down" data-id="' + cr.id + '" style="border-radius:0 0 5px 5px;border-top:none;' + (idx === p.classResources.length - 1 ? 'opacity:0.3;pointer-events:none;' : '') + '">&#9660;</div>' +
      '</div>' +
      '<input type="text" data-action="p-cr-label" data-id="' + cr.id + '" value="' + escapeHtml(cr.label) + '" placeholder="Libellé" style="flex:1;min-width:0;height:36px;padding:0 10px;"/>' +
      '<select data-action="p-cr-type" data-id="' + cr.id + '" style="height:36px;background:var(--bg-deep);border:1px solid rgba(var(--border-tint),0.24);border-radius:8px;color:var(--text-main);font-size:12px;">' +
        '<option value="badges" ' + (cr.type === 'badges' ? 'selected' : '') + '>Badges</option>' +
        '<option value="counter" ' + (cr.type === 'counter' ? 'selected' : '') + '>Compteur</option>' +
      '</select>' +
      '<label style="font-size:11px;color:var(--text-muted);">Max</label>' +
      '<input type="text" inputmode="numeric" pattern="[0-9]*" class="pnum" style="width:42px;height:36px;" value="' + cr.max + '" data-action="p-cr-max" data-id="' + cr.id + '"/>' +
      '<div class="premove" data-action="p-cr-remove" data-id="' + cr.id + '">&times;</div>' +
    '</div>';
  }).join('');
  var classResourcesHtml = '<div class="psec"><div class="psec-label">Ressource(s) de classe</div>' +
    (p.classResources.length ? '<div class="pcard">' + crRows + '</div>' : '') +
    '<div style="display:flex;gap:8px;">' +
      '<div class="padd" style="flex:1;" data-action="p-cr-add-badges">+ Ajouter une ressource</div>' +
      '<div class="padd" style="flex:1;" data-action="p-cr-add-counter">+ Ajouter un compteur</div>' +
    '</div></div>';

  var abilitiesHtml = '<div class="psec"><div class="psec-label">Caractéristiques</div><div class="pgrid3">' +
    ABILITY_KEYS.map(function (key) { return pField(ABILITY_LABELS[key], 'p-ability', key, p.abilityScores[key], true); }).join('') +
    '</div></div>';

  var savingThrowsHtml = '<div class="psec"><div class="psec-label">Jets de sauvegarde</div><div class="pgrid3">' +
    ABILITY_KEYS.map(function (key) { return pField('Sauv. ' + ABILITY_LABELS[key], 'p-saving', key, p.savingThrows[key], true); }).join('') +
    '</div></div>';

  var skillsHtml = '<div class="psec"><div class="psec-label">Compétences</div><div class="pcard">' +
    p.skills.map(function (s, idx) {
      return '<div class="prow">' +
        '<div style="flex:1;font-size:13px;font-weight:600;color:var(--text-main);">' + escapeHtml(s.name) + '</div>' +
        '<div class="premove" style="background:rgba(239,68,68,0.15);border-color:rgba(239,68,68,0.4);color:#ef4444;" data-action="p-skill-dec" data-index="' + idx + '">&minus;</div>' +
        '<input type="text" inputmode="text" pattern="-?[0-9]*" class="psigned" style="width:44px;height:36px;" value="' + formatSigned(s.modifier) + '" data-action="p-skill-input" data-index="' + idx + '"/>' +
        '<div class="premove" style="background:rgba(34,197,94,0.15);border-color:rgba(34,197,94,0.4);color:#22c55e;" data-action="p-skill-inc" data-index="' + idx + '">+</div>' +
      '</div>';
    }).join('') + '</div></div>';

  var preparedHtml = ui.activeChar === 'deneor'
    ? '<div class="psec"><div class="psec-label">Sorts préparés (un par ligne)</div>' +
        '<textarea data-action="p-prepared-spells" rows="6" style="width:100%;background:var(--bg-deep);border:1px solid rgba(var(--border-tint),0.24);border-radius:8px;color:var(--text-main);font-size:12.5px;padding:10px;font-family:inherit;resize:vertical;">' + escapeHtml(p.preparedSpells.join('\n')) + '</textarea>' +
      '</div>'
    : '';

  var goldHtml = '<div class="psec"><div class="psec-label">Or</div><div class="pgrid3">' +
    pField('Or (PO)', 'p-gold', 'gold', p.gold, false) +
    '</div></div>';

  document.getElementById('personPanel').innerHTML =
    '<div class="person-title font-cinzel">Personnage — ' + escapeHtml(CHARACTER_NAMES[ui.activeChar]) + '</div>' +
    hpHtml + combatHtml + togglesHtml + attacksHtml + spellLevelsHtml + classResourcesHtml +
    abilitiesHtml + savingThrowsHtml + skillsHtml + preparedHtml + goldHtml;

  bindPersonnageEvents();
}

function bindPersonnageEvents() {
  var panel = document.getElementById('personPanel');
  var p = personProfile();

  panel.querySelectorAll('[data-action="p-hp"]').forEach(function (el) {
    el.addEventListener('change', function () {
      var key = el.getAttribute('data-key');
      if (key === 'max') { p.hp.max = clamp(toInt(el.value, p.hp.max), 0, 999); p.hp.current = clamp(p.hp.current, 0, p.hp.max); }
      else if (key === 'current') p.hp.current = clamp(toInt(el.value, p.hp.current), 0, p.hp.max);
      else p.hp.temp = clamp(toInt(el.value, p.hp.temp), 0, 999);
      saveState(); render();
    });
  });

  panel.querySelectorAll('[data-action="p-combat"]').forEach(function (el) {
    el.addEventListener('change', function () {
      var key = el.getAttribute('data-key');
      if (key === 'hitDice') {
        p.combatStats.hitDice = el.value;
      } else {
        var min = (key === 'initiative' || key === 'spellAttackBonus') ? -99 : 0;
        p.combatStats[key] = clamp(toInt(el.value, p.combatStats[key]), min, 99);
      }
      saveState(); render();
    });
  });

  var concEl = panel.querySelector('[data-action="p-concentration"]');
  if (concEl) concEl.addEventListener('click', function () { p.concentration = !p.concentration; saveState(); render(); });
  var inspEl = panel.querySelector('[data-action="p-inspiration"]');
  if (inspEl) inspEl.addEventListener('click', function () { p.inspiration = !p.inspiration; saveState(); render(); });

  panel.querySelectorAll('[data-action="p-attack-name"]').forEach(function (el) {
    el.addEventListener('input', function () {
      var atk = p.attacks.find(function (x) { return x.id === el.getAttribute('data-id'); });
      if (atk) { atk.name = el.value; saveState(); }
    });
  });
  panel.querySelectorAll('[data-action="p-attack-damage-dice"]').forEach(function (el) {
    el.addEventListener('input', function () {
      var atk = p.attacks.find(function (x) { return x.id === el.getAttribute('data-id'); });
      if (atk) { atk.damageDice = el.value; saveState(); }
    });
  });
  panel.querySelectorAll('[data-action="p-attack-damage-type"]').forEach(function (el) {
    el.addEventListener('input', function () {
      var atk = p.attacks.find(function (x) { return x.id === el.getAttribute('data-id'); });
      if (atk) { atk.damageType = el.value; saveState(); }
    });
  });
  panel.querySelectorAll('[data-action="p-attack-range"]').forEach(function (el) {
    el.addEventListener('change', function () {
      var atk = p.attacks.find(function (x) { return x.id === el.getAttribute('data-id'); });
      if (!atk) return;
      atk.rangeMeters = clamp(toInt(el.value, atk.rangeMeters), 0, 999);
      saveState(); render();
    });
  });
  panel.querySelectorAll('[data-action="p-attack-bonus"]').forEach(function (el) {
    el.addEventListener('change', function () {
      var atk = p.attacks.find(function (x) { return x.id === el.getAttribute('data-id'); });
      if (!atk) return;
      atk.attackBonus = clamp(toInt(el.value, atk.attackBonus), -99, 99);
      saveState(); render();
    });
  });
  panel.querySelectorAll('[data-action="p-attack-damage-bonus"]').forEach(function (el) {
    el.addEventListener('change', function () {
      var atk = p.attacks.find(function (x) { return x.id === el.getAttribute('data-id'); });
      if (!atk) return;
      atk.damageBonus = clamp(toInt(el.value, atk.damageBonus), -99, 99);
      saveState(); render();
    });
  });
  panel.querySelectorAll('[data-action="p-attack-melee"]').forEach(function (el) {
    el.addEventListener('click', function () {
      var atk = p.attacks.find(function (x) { return x.id === el.getAttribute('data-id'); });
      if (atk) { atk.melee = !atk.melee; saveState(); render(); }
    });
  });
  panel.querySelectorAll('[data-action="p-attack-remove"]').forEach(function (el) {
    el.addEventListener('click', function () {
      var idx = p.attacks.findIndex(function (x) { return x.id === el.getAttribute('data-id'); });
      if (idx !== -1) { p.attacks.splice(idx, 1); saveState(); render(); }
    });
  });
  panel.querySelectorAll('[data-action="p-attack-up"]').forEach(function (el) {
    el.addEventListener('click', function () {
      var idx = p.attacks.findIndex(function (x) { return x.id === el.getAttribute('data-id'); });
      if (idx > 0) { var item = p.attacks.splice(idx, 1)[0]; p.attacks.splice(idx - 1, 0, item); saveState(); render(); }
    });
  });
  panel.querySelectorAll('[data-action="p-attack-down"]').forEach(function (el) {
    el.addEventListener('click', function () {
      var idx = p.attacks.findIndex(function (x) { return x.id === el.getAttribute('data-id'); });
      if (idx !== -1 && idx < p.attacks.length - 1) { var item = p.attacks.splice(idx, 1)[0]; p.attacks.splice(idx + 1, 0, item); saveState(); render(); }
    });
  });
  var attackAdd = panel.querySelector('[data-action="p-attack-add"]');
  if (attackAdd) attackAdd.addEventListener('click', function () {
    p.attacks.push({ id: generateAdminId(), name: 'Arme', melee: true, rangeMeters: 0, attackBonus: 0, damageDice: '', damageBonus: 0, damageType: '' });
    saveState(); render();
  });

  panel.querySelectorAll('[data-action="p-level-toggle"]').forEach(function (el) {
    el.addEventListener('click', function () {
      var lvl = parseInt(el.getAttribute('data-level'), 10);
      var sl = p.spellLevels.find(function (x) { return x.level === lvl; });
      if (!sl.enabled) {
        var lowerEnabled = p.spellLevels.filter(function (x) { return x.level < lvl; }).every(function (x) { return x.enabled; });
        if (!lowerEnabled) { ui.levelError = 'Activez d\'abord les niveaux inférieurs.'; render(); return; }
        sl.enabled = true;
        ui.levelError = '';
      } else {
        var higherEnabled = p.spellLevels.some(function (x) { return x.level > lvl && x.enabled; });
        if (higherEnabled && !confirm('Désactiver le niveau ' + lvl + ' désactivera aussi les niveaux supérieurs actifs. Continuer ?')) return;
        p.spellLevels.forEach(function (x) { if (x.level >= lvl) x.enabled = false; });
      }
      saveState(); render();
    });
  });
  panel.querySelectorAll('[data-action="p-level-max"]').forEach(function (el) {
    el.addEventListener('change', function () {
      var lvl = parseInt(el.getAttribute('data-level'), 10);
      var sl = p.spellLevels.find(function (x) { return x.level === lvl; });
      sl.max = clamp(toInt(el.value, sl.max), 0, 12);
      saveState(); render();
    });
  });

  panel.querySelectorAll('[data-action="p-cr-label"]').forEach(function (el) {
    el.addEventListener('input', function () {
      var cr = p.classResources.find(function (x) { return x.id === el.getAttribute('data-id'); });
      if (cr) { cr.label = el.value; saveState(); }
    });
  });
  panel.querySelectorAll('[data-action="p-cr-max"]').forEach(function (el) {
    el.addEventListener('change', function () {
      var cr = p.classResources.find(function (x) { return x.id === el.getAttribute('data-id'); });
      if (!cr) return;
      cr.max = clamp(toInt(el.value, cr.max), 0, cr.type === 'counter' ? 99 : 20);
      saveState(); render();
    });
  });
  panel.querySelectorAll('[data-action="p-cr-type"]').forEach(function (el) {
    el.addEventListener('change', function () {
      var cr = p.classResources.find(function (x) { return x.id === el.getAttribute('data-id'); });
      if (!cr) return;
      cr.type = el.value === 'counter' ? 'counter' : 'badges';
      cr.max = clamp(cr.max, 0, cr.type === 'counter' ? 99 : 20);
      saveState(); render();
    });
  });
  panel.querySelectorAll('[data-action="p-cr-remove"]').forEach(function (el) {
    el.addEventListener('click', function () {
      var idx = p.classResources.findIndex(function (x) { return x.id === el.getAttribute('data-id'); });
      if (idx !== -1) { p.classResources.splice(idx, 1); saveState(); render(); }
    });
  });
  panel.querySelectorAll('[data-action="p-cr-up"]').forEach(function (el) {
    el.addEventListener('click', function () {
      var idx = p.classResources.findIndex(function (x) { return x.id === el.getAttribute('data-id'); });
      if (idx > 0) { var item = p.classResources.splice(idx, 1)[0]; p.classResources.splice(idx - 1, 0, item); saveState(); render(); }
    });
  });
  panel.querySelectorAll('[data-action="p-cr-down"]').forEach(function (el) {
    el.addEventListener('click', function () {
      var idx = p.classResources.findIndex(function (x) { return x.id === el.getAttribute('data-id'); });
      if (idx !== -1 && idx < p.classResources.length - 1) { var item = p.classResources.splice(idx, 1)[0]; p.classResources.splice(idx + 1, 0, item); saveState(); render(); }
    });
  });
  var crAddBadges = panel.querySelector('[data-action="p-cr-add-badges"]');
  if (crAddBadges) crAddBadges.addEventListener('click', function () {
    p.classResources.push({ id: generateAdminId(), label: 'Ressource de Classe', max: 0, type: 'badges' });
    saveState(); render();
  });
  var crAddCounter = panel.querySelector('[data-action="p-cr-add-counter"]');
  if (crAddCounter) crAddCounter.addEventListener('click', function () {
    p.classResources.push({ id: generateAdminId(), label: 'Compteur', max: 0, type: 'counter' });
    saveState(); render();
  });

  panel.querySelectorAll('[data-action="p-ability"]').forEach(function (el) {
    el.addEventListener('change', function () {
      var key = el.getAttribute('data-key');
      p.abilityScores[key] = clamp(toInt(el.value, p.abilityScores[key]), -99, 99);
      saveState(); render();
    });
  });
  panel.querySelectorAll('[data-action="p-saving"]').forEach(function (el) {
    el.addEventListener('change', function () {
      var key = el.getAttribute('data-key');
      p.savingThrows[key] = clamp(toInt(el.value, p.savingThrows[key]), -99, 99);
      saveState(); render();
    });
  });

  panel.querySelectorAll('[data-action="p-skill-input"]').forEach(function (el) {
    el.addEventListener('change', function () {
      var idx = parseInt(el.getAttribute('data-index'), 10);
      p.skills[idx].modifier = clamp(toInt(el.value, p.skills[idx].modifier), -99, 99);
      saveState(); render();
    });
  });
  panel.querySelectorAll('[data-action="p-skill-inc"]').forEach(function (el) {
    el.addEventListener('click', function () {
      var idx = parseInt(el.getAttribute('data-index'), 10);
      p.skills[idx].modifier = clamp(p.skills[idx].modifier + 1, -99, 99);
      saveState(); render();
    });
  });
  panel.querySelectorAll('[data-action="p-skill-dec"]').forEach(function (el) {
    el.addEventListener('click', function () {
      var idx = parseInt(el.getAttribute('data-index'), 10);
      p.skills[idx].modifier = clamp(p.skills[idx].modifier - 1, -99, 99);
      saveState(); render();
    });
  });

  var preparedEl = panel.querySelector('[data-action="p-prepared-spells"]');
  if (preparedEl) {
    preparedEl.addEventListener('change', function () {
      p.preparedSpells = preparedEl.value.split('\n').map(function (s) { return s.trim(); }).filter(function (s) { return s; });
      saveState(); render();
    });
  }

  panel.querySelectorAll('[data-action="p-gold"]').forEach(function (el) {
    el.addEventListener('change', function () {
      p.gold = clamp(Math.round(toInt(el.value, p.gold)), 0, 10000);
      saveState(); render();
    });
  });
}

// ---- spell modal ----
function openSpellModal(index) {
  var section = sectionByLevel(ui.activeLevel);
  if (!section) { showToast('Creez d\'abord un niveau', true); return; }
  var form = document.getElementById('spellForm');
  form.reset();
  document.getElementById('sp_index').value = (index === undefined || index === null) ? '' : index;
  document.getElementById('spellModalTitle').textContent = (index === undefined || index === null) ? 'Ajouter un sort' : 'Modifier le sort';
  document.getElementById('btnDeleteSpell').style.display = (index === undefined || index === null) ? 'none' : 'inline-block';
  document.getElementById('alwaysAvailableField').style.display = (ui.activeChar === 'deneor' && ui.activeLevel !== 'classe') ? 'block' : 'none';

  if (index !== undefined && index !== null) {
    var spell = section.spells[index];
    document.getElementById('sp_name').value = spell.name || '';
    document.getElementById('sp_type').value = spell.type || '';
    document.getElementById('sp_range').value = spell.range || '';
    document.getElementById('sp_always').checked = !!spell.alwaysAvailable;
    document.getElementById('sp_desc').value = spell.desc || '';
    document.getElementById('sp_note').value = spell.note || '';
  }
  document.getElementById('spellModalBackdrop').classList.add('open');
  document.getElementById('sp_name').focus();
}
function closeSpellModal() { document.getElementById('spellModalBackdrop').classList.remove('open'); }

document.getElementById('spellForm').addEventListener('submit', function (e) {
  e.preventDefault();
  var section = sectionByLevel(ui.activeLevel);
  if (!section) return;
  var idxRaw = document.getElementById('sp_index').value;
  var spell = {
    name: document.getElementById('sp_name').value.trim(),
    type: document.getElementById('sp_type').value.trim(),
    range: document.getElementById('sp_range').value.trim(),
    desc: document.getElementById('sp_desc').value.trim(),
    note: document.getElementById('sp_note').value.trim()
  };
  if (ui.activeChar === 'deneor' && ui.activeLevel !== 'classe' && document.getElementById('sp_always').checked) {
    spell.alwaysAvailable = true;
  }
  if (idxRaw === '') {
    section.spells.push(spell);
  } else {
    section.spells[parseInt(idxRaw, 10)] = spell;
  }
  saveState();
  closeSpellModal();
  render();
  showToast(idxRaw === '' ? 'Sort ajoute' : 'Sort mis a jour');
});

document.getElementById('btnDeleteSpell').addEventListener('click', function () {
  var section = sectionByLevel(ui.activeLevel);
  var idxRaw = document.getElementById('sp_index').value;
  if (!section || idxRaw === '') return;
  var spell = section.spells[parseInt(idxRaw, 10)];
  if (!confirm('Supprimer "' + spell.name + '" ?')) return;
  section.spells.splice(parseInt(idxRaw, 10), 1);
  saveState();
  closeSpellModal();
  render();
  showToast('Sort supprime');
});

document.getElementById('btnCancelSpell').addEventListener('click', closeSpellModal);
document.getElementById('fabAdd').addEventListener('click', function () { openSpellModal(null); });
document.getElementById('spellModalBackdrop').addEventListener('click', function (e) { if (e.target.id === 'spellModalBackdrop') closeSpellModal(); });

// ---- level modal ----
function renderLevelList() {
  var sections = activeSections();
  var order = levelOrder(sections);
  var list = document.getElementById('levelList');
  if (!order.length) { list.innerHTML = '<div class="empty-hint">Aucun niveau pour ce personnage.</div>'; return; }
  list.innerHTML = order.map(function (lvl) {
    var s = sectionByLevel(lvl);
    return '<div style="display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 12px;background:rgba(var(--border-tint),0.08);border-radius:6px;">' +
      '<div style="font-size:13px;"><b>' + escapeHtml(s.title) + '</b> <span style="color:var(--text-dim);font-size:11px;">(' + s.spells.length + ' sort' + (s.spells.length > 1 ? 's' : '') + ')</span></div>' +
      '<span class="btn small danger" data-del-level="' + lvl + '">Supprimer</span>' +
    '</div>';
  }).join('');
  list.querySelectorAll('[data-del-level]').forEach(function (el) {
    el.addEventListener('click', function () {
      var lvl = el.dataset.delLevel === 'classe' ? 'classe' : parseInt(el.dataset.delLevel, 10);
      var s = sectionByLevel(lvl);
      if (!confirm('Supprimer le niveau "' + s.title + '" et ses ' + s.spells.length + ' sort(s) ?')) return;
      state[ui.activeChar] = activeSections().filter(function (x) { return x.level !== lvl; });
      saveState();
      renderLevelList();
      render();
      showToast('Niveau supprime');
    });
  });
}

function openLevelModal() {
  renderLevelList();
  document.getElementById('levelModalBackdrop').classList.add('open');
}
document.getElementById('btnCloseLevelModal').addEventListener('click', function () { document.getElementById('levelModalBackdrop').classList.remove('open'); });
document.getElementById('levelModalBackdrop').addEventListener('click', function (e) { if (e.target.id === 'levelModalBackdrop') document.getElementById('levelModalBackdrop').classList.remove('open'); });

document.getElementById('lv_level').addEventListener('change', function () {
  var v = this.value;
  var titleEl = document.getElementById('lv_title');
  var tagEl = document.getElementById('lv_tag');
  if (v === 'classe') { titleEl.value = 'Capacités de classe et dons'; tagEl.value = 'Classe'; }
  else if (v === '0') { titleEl.value = 'Sorts mineurs (niveau 0)'; tagEl.value = 'Niv. 0'; }
  else { titleEl.value = 'Niveau ' + v; tagEl.value = 'Niv. ' + v; }
});

document.getElementById('btnAddLevelConfirm').addEventListener('click', function () {
  var v = document.getElementById('lv_level').value;
  var level = v === 'classe' ? 'classe' : parseInt(v, 10);
  if (sectionByLevel(level)) { showToast('Ce niveau existe deja', true); return; }
  var title = document.getElementById('lv_title').value.trim() || ('Niveau ' + v);
  var tag = document.getElementById('lv_tag').value.trim() || ('Niv. ' + v);
  activeSections().push({ title: title, levelTag: tag, level: level, spells: [] });
  saveState();

// ---- derive un profil complet (avec used[]/current), meme forme que character.savedProfile
// exporte par l'app elle-meme (exportCharacterJson() dans index.html) ----
function deriveFullProfile(charId) {
  var p = state.profiles[charId];
  return {
    characterName: CHARACTER_NAMES[charId],
    hp: { current: p.hp.current, max: p.hp.max, temp: p.hp.temp },
    combatStats: { ac: p.combatStats.ac, initiative: p.combatStats.initiative, speed: p.combatStats.speed, spellSaveDc: p.combatStats.spellSaveDc, spellAttackBonus: p.combatStats.spellAttackBonus, hitDice: p.combatStats.hitDice },
    spellLevels: p.spellLevels.map(function (l) {
      var used = [];
      for (var i = 0; i < l.max; i++) used.push(false);
      return { level: l.level, enabled: l.enabled, max: l.max, used: used };
    }),
    classResources: p.classResources.map(function (cr) {
      var out = { id: cr.id, label: cr.label, max: cr.max, type: cr.type, used: [] };
      if (cr.type === 'counter') out.current = cr.max;
      else { var u = []; for (var j = 0; j < cr.max; j++) u.push(false); out.used = u; }
      return out;
    }),
    attacks: JSON.parse(JSON.stringify(p.attacks)),
    concentration: p.concentration,
    inspiration: p.inspiration,
    abilityScores: JSON.parse(JSON.stringify(p.abilityScores)),
    savingThrows: JSON.parse(JSON.stringify(p.savingThrows)),
    skills: JSON.parse(JSON.stringify(p.skills)),
    preparedSpells: p.preparedSpells.slice(),
    gold: p.gold
  };
}

// ---- écran de connexion obligatoire : aucun contenu de l'outil admin n'est monté dans le DOM
// (appRoot reste display:none) tant que l'utilisateur n'est pas identifié comme administrateur
// (lecture réussie de cantrip/_meta, réservée à l'admin par les règles RTDB) ou comme utilisateur
// approuvé (approvedUsers/{uid}, lecture réservée à soi-même — voir CLAUDE.md pour la règle RTDB
// à ajouter si elle ne l'est pas déjà). Un utilisateur approuvé mais non-admin n'a pas accès à
// l'onglet "Accès" (données admin-only).
var authState = { user: null, isAdmin: false, authorized: false, checking: false, requested: false, error: null };

function renderAuthGate() {
  var gate = document.getElementById('authGate');
  var root = document.getElementById('appRoot');
  if (authState.authorized) { gate.style.display = 'none'; root.style.display = 'flex'; return; }
  root.style.display = 'none';
  gate.style.display = 'flex';

  var html;
  if (!authState.user) {
    html = '<div class="gate-card"><div class="gate-title font-cinzel">Cantrip · Admin</div>' +
      '<p>Cet outil est réservé aux utilisateurs approuvés. Connectez-vous avec votre compte Google pour continuer.</p>' +
      '<button class="btn primary" id="btnGateSignIn">Se connecter avec Google</button>' +
      (authState.error ? '<div class="gate-error">' + escapeHtml(authState.error) + '</div>' : '') +
      '</div>';
  } else if (authState.checking) {
    html = '<div class="gate-card"><div class="gate-title font-cinzel">Cantrip · Admin</div><p>Vérification de vos accès…</p></div>';
  } else {
    html = '<div class="gate-card"><div class="gate-title font-cinzel">Accès non autorisé</div>' +
      '<div class="gate-user">' + escapeHtml(authState.user.email || authState.user.uid) + '</div>' +
      '<p>Ce compte n\'a pas encore été approuvé pour l\'outil admin.</p>' +
      '<button class="btn primary" id="btnGateRequest"' + (authState.requested ? ' disabled' : '') + '>' +
        (authState.requested ? 'Demande envoyée' : 'Demander l\'accès') +
      '</button>' +
      '<button class="btn" id="btnGateSignOut">Se déconnecter</button>' +
      (authState.requested ? '<div class="gate-hint">L\'administrateur doit approuver ce compte avant que l\'accès ne s\'ouvre.</div>' : '') +
      (authState.error ? '<div class="gate-error">' + escapeHtml(authState.error) + '</div>' : '') +
      '</div>';
  }
  gate.innerHTML = html;
  var signIn = document.getElementById('btnGateSignIn');
  if (signIn) signIn.addEventListener('click', gateSignIn);
  var req = document.getElementById('btnGateRequest');
  if (req) req.addEventListener('click', gateRequestAccess);
  var signOut = document.getElementById('btnGateSignOut');
  if (signOut) signOut.addEventListener('click', function () { fbAuth.signOut(); });
}

function gateSignIn() {
  authState.error = null; renderAuthGate();
  var provider = new firebase.auth.GoogleAuthProvider();
  fbAuth.signInWithPopup(provider).catch(function (err) {
    authState.error = 'Connexion refusée (' + (err.code || err.message) + ')';
    renderAuthGate();
  });
}

function gateRequestAccess() {
  var user = authState.user;
  if (!user) return;
  fbDb.ref('accessRequests/' + user.uid).set({
    email: user.email || '', name: user.displayName || '', requestedAt: Date.now()
  }).then(function () {
    authState.requested = true; renderAuthGate();
  }).catch(function (err) {
    authState.error = err.message || 'Échec de la demande d\'accès';
    renderAuthGate();
  });
}

function checkAuthorization(user) {
  authState.checking = true; renderAuthGate();
  fbDb.ref(FB_DATA_PATH + '/_meta').once('value').then(function () {
    authState.isAdmin = true; authState.authorized = true; authState.checking = false;
    onAuthorized();
  }).catch(function () {
    fbDb.ref('approvedUsers/' + user.uid).once('value').then(function (snap) {
      authState.isAdmin = false; authState.authorized = snap.val() === true; authState.checking = false;
      if (authState.authorized) onAuthorized(); else renderAuthGate();
    }).catch(function () {
      authState.isAdmin = false; authState.authorized = false; authState.checking = false;
      renderAuthGate();
    });
  });
}

// Premier rendu du contenu, uniquement une fois l'autorisation confirmée.
function onAuthorized() {
  var email = document.getElementById('admHeaderUser');
  email.innerHTML = '<span class="email">' + escapeHtml(authState.user.email || '') + '</span>' +
    '<button class="btn small" id="btnHeaderSignOut">Déconnexion</button>';
  document.getElementById('btnHeaderSignOut').addEventListener('click', function () { fbAuth.signOut(); });
  render();
  renderAuthGate();
  renderSyncFooter(loadSyncMetaCache());
}

fbAuth.onAuthStateChanged(function (user) {
  authState.user = user;
  authState.requested = false;
  if (user) { authState.error = null; checkAuthorization(user); }
  else { authState.isAdmin = false; authState.authorized = false; authState.checking = false; renderAuthGate(); }
});

function fbEnsureAuth() {
  if (fbAuth.currentUser) return Promise.resolve(fbAuth.currentUser);
  var provider = new firebase.auth.GoogleAuthProvider();
  return fbAuth.signInWithPopup(provider).then(function (result) {
    return result.user;
  }).catch(function (err) {
    throw new Error('Connexion Google refusee (' + (err.code || err.message) + ')');
  });
}

// Lecture/écriture ciblées sur cantrip/{charId} (pas le nœud "cantrip" entier) : chaque
// personnage a ses propres règles de sécurité RTDB ($charId, voir Firebase Console). L'admin
// passe outre via son UID (voir règles), mais ce ciblage reste nécessaire pour que le "Personnage"
// choisi ne touche jamais accidentellement un autre personnage ni cantrip/_meta (métadonnées de
// synchro, règle séparée — voir fbLoadMeta()/fbSaveMeta() plus bas).

  });
}

function fbSaveCharacterEntry(charId, entry) {

}

function fbLoadMeta() {
  return fbEnsureAuth().then(function () {

    });
  });
}

function fbSaveMeta(meta) {

// ---- gestion des demandes d'accès (approvedUsers / accessRequests) ----
// L'admin (seul UID autorisé par les règles RTDB à lire/écrire ces deux chemins) approuve ou
// refuse les demandes envoyées automatiquement par index.html (fbRequestAccess()) au premier
// login d'un utilisateur non encore approuvé.
function fbLoadAccessData() {
  ui.accessBusy = true; ui.accessError = null; render();
  return fbEnsureAuth().then(function () {
    return Promise.all([
      fbDb.ref('accessRequests').once('value'),
      fbDb.ref('approvedUsers').once('value'),
      fbDb.ref('approvedUserInfo').once('value'),
      fbDb.ref('cantrip').once('value'),
      fbDb.ref('characterOwners').once('value'),
      fbDb.ref('characterAccess').once('value')
    ]);
  }).then(function (results) {
    var requestsVal = results[0].val() || {};
    var approvedVal = results[1].val() || {};
    var infoVal = results[2].val() || {};
    var cantripVal = results[3].val() || {};
    var ownersVal = results[4].val() || {};
    var accessVal = results[5].val() || {};
    ui.accessRequests = Object.keys(requestsVal).map(function (uid) {
      var r = requestsVal[uid] || {};
      return { uid: uid, email: r.email || '', name: r.name || '', requestedAt: r.requestedAt || 0 };
    }).sort(function (a, b) { return b.requestedAt - a.requestedAt; });
    ui.approvedUsers = Object.keys(approvedVal).filter(function (uid) { return approvedVal[uid] === true; }).map(function (uid) {
      var info = infoVal[uid] || {};
      return { uid: uid, email: info.email || '', name: info.name || '' };
    });
    // "_meta" n'est pas un personnage (métadonnées de synchro, voir fbLoadMeta()) — exclu ici.
    ui.accessCharacters = Object.keys(cantripVal).filter(function (charId) { return charId !== '_meta'; }).map(function (charId) {
      var entry = cantripVal[charId] || {};
      var name = (entry.profile && entry.profile.characterName) || charId;
      var accessMap = accessVal[charId] || {};
      var accessUids = Object.keys(accessMap).filter(function (uid) { return accessMap[uid] === true; });
      return { charId: charId, name: name, ownerUid: ownersVal[charId] || '', accessUids: accessUids };
    }).sort(function (a, b) { return a.name.localeCompare(b.name); });
    ui.accessBusy = false;
    render();
  }).catch(function (err) {
    ui.accessBusy = false;
    ui.accessError = err.message || 'Echec du chargement des acces';
    render();
  });
}

function fbSetCharacterOwner(charId, uid) {

    return uid ? fbDb.ref('characterOwners/' + charId).set(uid) : fbDb.ref('characterOwners/' + charId).remove();
  }).then(function () {

// Copie email/nom de la demande approuvée dans approvedUserInfo : la demande elle-même est
// supprimée après approbation (accessRequests), donc sans cette copie l'email disparaîtrait de

        '</div>' +
        '<div>' +
          '<div style="font-size:11px;color:var(--text-label);text-transform:uppercase;letter-spacing:0.06em;margin-bottom:4px;">Accès accordé à</div>' +
          accessRows +
        '</div>' +
      '</div>' +
    '</div>';
  }).join('');

  panel.innerHTML =
    '<div class="psec"><div class="psec-label">Gestion des accès Firebase</div></div>' +
    errorHtml + busyHtml +
    '<div class="psec"><div class="psec-label">Demandes en attente</div><div class="pcard">' +
      (requestsHtml || '<div class="empty-hint">Aucune demande en attente.</div>') +
    '</div></div>' +
    '<div class="psec"><div class="psec-label">Utilisateurs approuvés</div><div class="pcard">' +
      (approvedHtml || '<div class="empty-hint">Aucun utilisateur approuvé pour l\'instant.</div>') +
    '</div></div>' +
    '<div class="psec"><div class="psec-label">Personnages (accès par joueur)</div>' +
      (charactersHtml || '<div class="empty-hint">Aucun personnage sur Firebase pour l\'instant.</div>') +
    '</div>' +
    '<button class="btn" id="btnAccessRefresh">Actualiser</button>';

  var refreshBtn = document.getElementById('btnAccessRefresh');
  if (refreshBtn) refreshBtn.addEventListener('click', fbLoadAccessData);
  panel.querySelectorAll('[data-action="access-approve"]').forEach(function (el) {
    el.addEventListener('click', function () { fbApproveAccess(el.getAttribute('data-uid')); });
  });
  panel.querySelectorAll('[data-action="access-deny"]').forEach(function (el) {
    el.addEventListener('click', function () { fbDenyAccess(el.getAttribute('data-uid')); });
  });
  panel.querySelectorAll('[data-action="access-revoke"]').forEach(function (el) {
    el.addEventListener('click', function () { fbRevokeAccess(el.getAttribute('data-uid')); });
  });
  panel.querySelectorAll('[data-action="access-char-owner"]').forEach(function (el) {
    el.addEventListener('change', function () { fbSetCharacterOwner(el.getAttribute('data-charid'), el.value); });
  });
  panel.querySelectorAll('[data-action="access-char-toggle"]').forEach(function (el) {
    el.addEventListener('change', function () { fbToggleCharacterAccess(el.getAttribute('data-charid'), el.getAttribute('data-uid'), el.checked); });
  });
  panel.querySelectorAll('[data-action="access-char-delete"]').forEach(function (el) {
    el.addEventListener('click', function () { fbDeleteCharacterFirebase(el.getAttribute('data-charid'), el.getAttribute('data-name')); });
  });
}

function fbLoadPersonnage() {
  var charId = ui.activeChar;
  if (!confirm('Charger "' + CHARACTER_NAMES[charId] + '" depuis Firebase ?')) return;
  showToast('Chargement depuis Firebase...');
  fbLoadCharacterEntry(charId).then(function (entry) {
    if (!entry || typeof entry !== 'object') throw new Error('Aucune sauvegarde pour ce personnage dans bdd.json sur Firebase.');
    // Compat avec bdd.json ecrit avant l'ajout du grimoire : entry etait alors le profil
    // directement, sans cle "profile"/"grimoire".
    var loadedProfile = (entry.profile && typeof entry.profile === 'object') ? entry.profile : entry;
    sanitizeAdminProfile(loadedProfile);
    state.profiles[charId] = loadedProfile;
    // Pas de grimoire enregistre sur Firebase pour ce personnage : on laisse le grimoire actuel de
    // l'outil admin tel quel plutot que de l'effacer.
    if (entry.grimoire && Array.isArray(entry.grimoire.sections)) state[charId] = entry.grimoire.sections;
    saveState();
    render();
    showToast('Le personnage a été chargé avec succès.', 'success');
    recordSyncEvent('lastLoad', charId);
  }).catch(function (err) {
    showToast(err.message || 'Echec du chargement Firebase', true);
  });
}

function fbSavePersonnage() {
  var charId = ui.activeChar;
  if (!confirm('Sauvegarder "' + CHARACTER_NAMES[charId] + '" sur Firebase ?')) return;
  var payload = { profile: deriveFullProfile(charId), grimoire: { sections: JSON.parse(JSON.stringify(state[charId])) } };
  showToast('Sauvegarde sur Firebase...');
  fbSaveCharacterEntry(charId, payload).then(function () {
    showToast('Le personnage a été sauvegardé avec succès.', 'success');
    recordSyncEvent('lastSave', charId);
  }).catch(function (err) {
    showToast(err.message || 'Echec de la sauvegarde Firebase', true);
  });
}

// ---- footer : date/heure du dernier chargement et de la derniere sauvegarde, tous appareils
// confondus (bdd.json._meta, ecrit aussi bien par cet outil que par l'app index.html). Un cache
// local permet d'afficher immediatement la derniere valeur connue
// au chargement de la page, sans forcer une authentification Google au demarrage.
var SYNC_META_CACHE_KEY = 'cantrip_admin_sync_meta_cache';
var SYNC_SOURCE_LABELS = { app: "l'application", admin: "l'outil admin" };

function loadSyncMetaCache() {
  try { return JSON.parse(localStorage.getItem(SYNC_META_CACHE_KEY)) || {}; } catch (e) { return {}; }
}

function formatSyncDate(iso) {
  var d = new Date(iso);
  if (isNaN(d.getTime())) return iso;
  return d.toLocaleDateString('fr-FR') + ' à ' + d.toLocaleTimeString('fr-FR', { hour: '2-digit', minute: '2-digit' });
}

function renderSyncFooter(meta) {
  var el = document.getElementById('syncFooter');
  if (!el) return;
  meta = meta || {};
  function line(label, entry) {
    if (!entry || !entry.at) return label + ' : jamais';
    var charName = CHARACTER_NAMES[entry.charId] || entry.charId;
    var src = SYNC_SOURCE_LABELS[entry.source] || entry.source;
    return label + ' : ' + formatSyncDate(entry.at) + ' — ' + charName + ' (' + src + ')';
  }
  el.innerHTML =
    '<span>' + line('Dernier chargement', meta.lastLoad) + '</span>' +
    '<span>' + line('Dernière sauvegarde', meta.lastSave) + '</span>' +
    '<span class="refresh-link" id="syncFooterRefresh">Actualiser</span>';
  var refreshBtn = document.getElementById('syncFooterRefresh');
  if (refreshBtn) refreshBtn.addEventListener('click', refreshSyncMeta);
}

function updateSyncMetaDisplay(meta) {
  meta = meta || {};
  try { localStorage.setItem(SYNC_META_CACHE_KEY, JSON.stringify(meta)); } catch (e) {}
  renderSyncFooter(meta);
}

// Ecriture best-effort d'un evenement de synchro (chargement) : n'affecte jamais le resultat de
// l'action en cours si elle echoue.
function recordSyncEvent(kind, charId) {
  fbLoadMeta().then(function (meta) {
    meta[kind] = { at: new Date().toISOString(), charId: charId, source: 'admin' };
    return fbSaveMeta(meta);
  }).then(function (meta) {
    updateSyncMetaDisplay(meta);
  }).catch(function () { /* best-effort */ });
}

// Rafraichissement a la demande (geste utilisateur explicite, pour ne pas etre bloque par le
// navigateur comme le serait une authentification Google declenchee automatiquement au chargement
// de la page).
function refreshSyncMeta() {
  showToast('Actualisation...');
  fbLoadMeta().then(function (meta) {
    updateSyncMetaDisplay(meta);
    showToast('Actualisé', 'success');
  }).catch(function (err) {
    showToast(err.message || 'Échec de l\'actualisation', true);
  });
}

state = loadState();
renderAuthGate();
</script>
